name: nimzo
description: Nimzo social voice-room app
publish_to: none
version: 1.0.13+113
environment:
  sdk: ">=3.3.0 <4.0.0"
dependencies:
  flutter: {sdk: flutter}
  flutter_riverpod: ^2.5.1
  go_router: ^14.0.0
  supabase_flutter: ^2.15.4
  url_launcher: ^6.3.2
  package_info_plus: ^8.1.0
  lucide_flutter: ^1.47.0
  google_fonts: ^6.2.1
  image_picker: ^1.1.2
  country_picker: ^2.0.26
  in_app_purchase: ^3.2.0
  in_app_purchase_android: ^0.5.3
  flutter_svg: ^2.0.17
  video_player: ^2.9.2
dev_dependencies:
  flutter_test: {sdk: flutter}
  flutter_lints: ^4.0.0
  http: ^1.2.0
  video_player_platform_interface: 6.9.0
flutter:
  uses-material-design: true
  assets:
    - assets/yo2_gifts/images/
    - assets/reference/fonts/Cinzel-OFL.txt
    - assets/reference/fonts/Poppins-OFL.txt
    - assets/reference/gift/
    - assets/reference/fruit/
    - assets/reference/grady/
    - assets/reference/slot/
    - assets/reference/game/
    - assets/reference/med/
    - assets/reference/frame/
    - assets/reference/car/
    - assets/reference/pg/
    - assets/reference/lv/
    - assets/reference/svip/
    - assets/reference/vip/
    - assets/reference/tool/
    - assets/reference/gem/
    - assets/reference/chest/
    - assets/reference/crys/
    - assets/reference/rmed/
    - assets/reference/prz/
    - assets/reference/emblems/
    - assets/reference/icons/
  fonts:
    - family: Cinzel
      fonts:
        - asset: assets/reference/fonts/Cinzel.ttf
    - family: Poppins
      fonts:
        - asset: assets/reference/fonts/Poppins-Regular.ttf
        - asset: assets/reference/fonts/Poppins-SemiBold.ttf
          weight: 600
