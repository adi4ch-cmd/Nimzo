name: Rebaseline NIMZO Honor Wall screenshot

on:
  push:
    branches:
      - feature/profile-reference-redesign
    paths:
      - .github/workflows/nimzo-rebaseline-medals.yml

permissions:
  contents: write

jobs:
  rebaseline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout latest feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/profile-reference-redesign
          persist-credentials: true

      - name: Flutter stable
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.6"
          channel: stable
          cache: true

      - name: Install dependencies
        working-directory: nimzo
        run: flutter pub get

      - name: Render new NIMZO Honor Wall screenshot
        working-directory: nimzo
        run: flutter test --update-goldens --dart-define=NIMZO_GOLDEN_TARGET=honor_wall test/remaining_visual_qa_test.dart

      - name: Commit only the new Honor Wall reference
        shell: bash
        run: |
          set -euo pipefail
          target=nimzo/test/goldens/remaining/honor_wall.png
          test -s "$target"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "$target"
          if git diff --cached --quiet; then
            echo "Golden unchanged"
            exit 0
          fi
          git commit -m "test(medals): update verified NIMZO Honor Wall golden"
          git push origin HEAD:feature/profile-reference-redesign
