name: NIMZO visual QA reference refresh

on:
  push:
    branches: [feature/profile-reference-redesign]
    paths:
      - .github/workflows/nimzo-visual-qa-refresh-once.yml

permissions:
  contents: write

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.6'
          channel: stable
      - name: Restore dependencies
        working-directory: nimzo
        run: flutter pub get
      - name: Verify Moment gifting
        working-directory: nimzo
        run: flutter test test/moment_gift_refresh_test.dart
      - name: Render current locked previews
        working-directory: nimzo
        run: flutter test --update-goldens test/master_visual_preview_test.dart test/remaining_visual_qa_test.dart
      - name: Review exact changed golden paths
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import subprocess
          allowed = {
            'nimzo/test/goldens/vip_final.png',
            'nimzo/test/goldens/svip_final.png',
            'nimzo/test/goldens/remaining/gifts.png',
            'nimzo/test/goldens/remaining/moments.png',
            'nimzo/test/goldens/remaining/public_profile.png',
            'nimzo/test/goldens/remaining/store.png',
            'nimzo/test/goldens/remaining/levels.png',
            'nimzo/test/goldens/remaining/honor_wall.png'
          }
          changed = set(subprocess.check_output(
            ['git','diff','--name-only','--','nimzo/test/goldens'],text=True
          ).splitlines())
          print('REVIEWED_GOLDENS:', sorted(changed))
          if not changed.issubset(allowed):
            raise SystemExit('Unreviewed screenshot files were modified: ' + repr(sorted(changed-allowed)))
          PY
          git add nimzo/test/goldens
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "test: record current reviewed Hilo visual updates in Nimzo goldens"
            git pull --rebase origin feature/profile-reference-redesign
            git push origin HEAD:feature/profile-reference-redesign
          fi
