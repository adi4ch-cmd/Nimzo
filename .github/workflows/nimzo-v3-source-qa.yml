name: NIMZO v3 Source and Backend QA (No APK)
on:
  push:
    branches: [integration/nimzo-v3-dynamic-20261021]
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: v3-source-${{ github.ref }}
  cancel-in-progress: true
jobs:
  flutter-and-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m pip install PyYAML==6.0.3 Pillow==12.3.0
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.6'
          channel: stable
          cache: true
      - name: Verify source lock and Python build guards
        run: |
          python3 tools/verify_nimzo_feature_lock.py
          python3 -m unittest discover -s tools/tests -p '*test.py'
          python3 -m unittest discover -s tools -p test_validate_vivox_sdk.py
      - name: Restore locked Flutter packages
        working-directory: nimzo
        run: flutter pub get --enforce-lockfile
      - name: Analyze all Flutter source
        working-directory: nimzo
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - name: Full Flutter regression (no APK)
        working-directory: nimzo
        run: flutter test --concurrency=4 --reporter expanded
      - name: Isolated Postgres security and financial fixtures
        env:
          SQL_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          docker exec -i "$SQL_CONTAINER" psql -U postgres -v ON_ERROR_STOP=1 <<'SQL'
          create role anon;
          create role authenticated;
          create role service_role bypassrls;
          SQL
          python3 tools/test_gift_checked_send.py --container "$SQL_CONTAINER" --database gift_checked_ci
          python3 tools/test_dynamic_room_rocket_config.py --container "$SQL_CONTAINER" --database rocket_dynamic_ci
          python3 tools/test_drive_catalog.py --container "$SQL_CONTAINER" --gift-fixture gift_checked_ci --database drive_catalog_ci
          python3 tools/test_expanded_drive_catalog.py --container "$SQL_CONTAINER" --fixture drive_catalog_ci --database drive_expanded_ci
          python3 tools/test_store_ownership_expiry.py --container "$SQL_CONTAINER" --database store_expiry_ci
          python3 tools/test_dynamic_memberships.py --container "$SQL_CONTAINER" --database membership_dynamic_ci
          python3 tools/test_dynamic_event_images.py --container "$SQL_CONTAINER" --database event_images_ci
          python3 tools/test_room_treasure.py --container "$SQL_CONTAINER" --database treasure_escrow_ci
          python3 tools/test_game_receipt_recovery.py --container "$SQL_CONTAINER" --database game_receipt_ci
          python3 tools/test_room_polls.py --container "$SQL_CONTAINER" --database polls_ci
          python3 tools/test_checked_diamond_exchange.py --container "$SQL_CONTAINER" --database exchange_ci
      - name: Gift media authorization tests
        run: node --test supabase/functions/gift-media/tests/access.test.mjs
