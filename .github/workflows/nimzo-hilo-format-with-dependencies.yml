name: NIMZO final canonical Dart formatting
on:
  push:
    branches:
      - feature/profile-reference-redesign
    paths:
      - .github/workflows/nimzo-hilo-format-with-dependencies.yml
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.6'
          channel: stable
      - name: Resolve project language version
        working-directory: nimzo
        run: flutter pub get
      - name: Format with resolved Dart project version
        working-directory: nimzo
        run: dart format lib test
      - name: Commit canonical style if needed
        run: |
          set -euo pipefail
          git config user.name 'NIMZO Flutter Formatter'
          git config user.email 'actions@users.noreply.github.com'
          git add nimzo/lib nimzo/test
          if ! git diff --cached --quiet; then
            git commit -m 'style: apply project-language Dart formatter'
            git push origin HEAD:feature/profile-reference-redesign
          fi
