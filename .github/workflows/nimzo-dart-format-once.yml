name: NIMZO one-time Dart formatting repair

on:
  push:
    branches: [feature/profile-reference-redesign]
    paths:
      - .github/workflows/nimzo-dart-format-once.yml

permissions:
  contents: write

jobs:
  format-and-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.6'
          channel: stable
      - name: Apply Dart formatting with no functional modifications
        shell: bash
        run: |
          set -euo pipefail
          cd nimzo
          dart format lib test
          cd ..
          if ! git diff --quiet -- nimzo/lib nimzo/test; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add nimzo/lib nimzo/test
            git commit -m "style: fix pre-existing Dart format violations for SVIP verification"
            git push origin HEAD:feature/profile-reference-redesign
          fi
