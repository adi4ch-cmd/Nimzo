name: NIMZO published APK auth runtime QA

on:
  push:
    branches:
      - qa/auth-runtime-20261020
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  auth-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Download exact published APK and verify SHA256
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "${{ runner.temp }}/nimzo-auth-qa"
          gh release download nimzo-1.0.36-no-vivox-test-39373065638 --repo "$GITHUB_REPOSITORY" --pattern NIMZO_1.0.36_NO_VIVOX_TEST.apk --dir "${{ runner.temp }}/nimzo-auth-qa"
          echo "b46ea63a0c9d25b0067eaaf0e4ab6b83c27545a416c2649b0bc4ae80394acfc4  ${{ runner.temp }}/nimzo-auth-qa/NIMZO_1.0.36_NO_VIVOX_TEST.apk" | sha256sum --check
      - name: Enable KVM access
        run: |
          test -e /dev/kvm
          sudo chmod a+rw /dev/kvm
      - name: Exercise published APK on Android 35
        uses: reactivecircus/android-emulator-runner@v2
        env:
          NIMZO_QA_APK: ${{ runner.temp }}/nimzo-auth-qa/NIMZO_1.0.36_NO_VIVOX_TEST.apk
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_6
          ram-size: 2048M
          heap-size: 256M
          emulator-boot-timeout: 900
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot -camera-back none -camera-front none -accel on
          script: python3 tools/nimzo_auth_runtime_qa.py "$NIMZO_QA_APK"
      - name: Preserve runtime evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nimzo-auth-runtime-39373065638
          path: nimzo/build/auth-runtime-evidence/
          if-no-files-found: warn
          retention-days: 14
