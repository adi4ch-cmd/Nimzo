name: NIMZO Final Backend Release APK Artifact
# Explicit owner-requested device test only. NOT a signed production release.
# Owner-authorized release MODE artifact; development signing, no production publication.
on:
  workflow_dispatch: {}
  push:
    branches: [feature/tingle-ui-rebuild-20261017]
    paths: [.github/workflows/nimzo-final-release-apk.yml]

permissions:
  contents: write

jobs:
  android-release-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    defaults:
      run:
        working-directory: nimzo
    steps:
      - name: Checkout exact backend source
        uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Flutter 3.47.6
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.6'
          channel: stable
          cache: true
      - name: Generate Android host and configure package
        shell: bash
        run: |
          set -euo pipefail
          flutter create . --no-pub --org io.nimzo --project-name nimzo --platforms android
          # Flutter create rewrites pubspec.lock even in an existing project.
          # Restore the reviewed dependency graph before any resolution/build.
          git restore --source=HEAD -- pubspec.lock
          git diff --exit-code -- pubspec.yaml
          python3 ../tools/configure_android_gradle.py android
          python3 - <<'PY'
          from pathlib import Path
          import re
          g = Path('android/app/build.gradle.kts')
          if not g.exists(): raise SystemExit('Missing generated Kotlin Gradle script')
          s = g.read_text()
          s, n = re.subn(r'namespace\s*=\s*"[^"]+"', 'namespace = "io.nimzo.app"', s, count=1)
          if n != 1: raise SystemExit('Could not set namespace')
          s, n = re.subn(r'applicationId\s*=\s*"[^"]+"', 'applicationId = "io.nimzo.app"', s, count=1)
          if n != 1: raise SystemExit('Could not set app ID')
          g.write_text(s)
          old = Path('android/app/src/main/kotlin/io/nimzo/nimzo/MainActivity.kt')
          if old.exists():
              new = Path('android/app/src/main/kotlin/io/nimzo/app/MainActivity.kt')
              new.parent.mkdir(parents=True, exist_ok=True)
              new.write_text(old.read_text().replace('package io.nimzo.nimzo', 'package io.nimzo.app'))
              old.unlink()
          manifest = Path('android/app/src/main/AndroidManifest.xml')
          m = manifest.read_text()
          m = re.sub(r'android:label="[^"]+"', 'android:label="NIMZO UI Test"', m, count=1)
          for perm in ['android.permission.INTERNET', 'android.permission.RECORD_AUDIO',
                       'android.permission.MODIFY_AUDIO_SETTINGS']:
              if perm not in m:
                  m = m.replace('<application', f'<uses-permission android:name="{perm}" />\n    <application', 1)
          if 'android:scheme="io.nimzo.app"' not in m:
              intent = '''<intent-filter android:autoVerify="false">
                <action android:name="android.intent.action.VIEW" />
                <category android:name="android.intent.category.DEFAULT" />
                <category android:name="android.intent.category.BROWSABLE" />
                <data android:scheme="io.nimzo.app" android:host="login-callback" />
              </intent-filter>'''
              m = m.replace('</activity>', intent+'\n        </activity>', 1)
          manifest.write_text(m)
          print('UI APK package set to io.nimzo.app')
          PY
          python3 ../tools/install_android_brand.py android assets/brand/nimzo_purple_gold.png
          rm -f test/widget_test.dart
      - name: Install Vivox Android bridge
        working-directory: nimzo
        shell: bash
        run: |
          set -euo pipefail
          find android/app/src/main/kotlin -name MainActivity.kt -delete
          mkdir -p android/app/src/main/java/io/nimzo/app
          mkdir -p android/app/src/main/java/io/nimzo/vivox
          mkdir -p android/app/src/main/cpp
          mkdir -p android/app/src/main/res/drawable
          cp native/vivox/android/nimzo_launcher.xml android/app/src/main/res/drawable/nimzo_launcher.xml
          cp assets/brand/nimzo_purple_gold.png android/app/src/main/res/drawable/nimzo_brand_icon.png
          cp native/vivox/android/proguard-rules.pro android/app/proguard-rules.pro
          cp native/vivox/android/NimzoUpdate.java android/app/src/main/java/io/nimzo/app/NimzoUpdate.java
          cp native/vivox/android/MainActivity.java android/app/src/main/java/io/nimzo/app/MainActivity.java
          cp native/vivox/android/NimzoVivox.java android/app/src/main/java/io/nimzo/vivox/NimzoVivox.java
          cp native/vivox/android/vivox_bridge.cpp android/app/src/main/cpp/vivox_bridge.cpp
          cp native/vivox/android/CMakeLists.txt android/app/src/main/cpp/CMakeLists.txt

      - name: Configure Android ID permissions and OAuth callback
        working-directory: nimzo
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          gradle = Path("android/app/build.gradle.kts")
          if not gradle.exists():
              gradle = Path("android/app/build.gradle")
          s = gradle.read_text()

          if gradle.suffix == ".kts":
              s = re.sub(r'namespace\s*=\s*"[^"]+"', 'namespace = "io.nimzo.app"', s, count=1)
              s = re.sub(r'applicationId\s*=\s*"[^"]+"', 'applicationId = "io.nimzo.app"', s, count=1)
          s += '''
          // Nimzo Vivox native bridge
          android {
              defaultConfig {
                  externalNativeBuild {
                      cmake {
                          arguments.add("-DVIVOX_SDK_ROOT=/tmp/vivox/android")
                      }
                  }
              }
              externalNativeBuild {
                  cmake {
                      path = file("src/main/cpp/CMakeLists.txt")
                      version = "3.22.1"
                  }
              }
          }
          '''
          gradle.write_text(s)

          manifest = Path("android/app/src/main/AndroidManifest.xml")
          m = manifest.read_text()
          m = re.sub(r'android:label="[^"]+"', 'android:label="Nimzo"', m, count=1)
          m = re.sub(r'android:icon="[^"]+"', 'android:icon="@drawable/nimzo_launcher"', m, count=1)
          if "xmlns:tools=" not in m:
              m = m.replace("<manifest", '<manifest xmlns:tools="http://schemas.android.com/tools"', 1)

          for perm in [
              "android.permission.REQUEST_INSTALL_PACKAGES",
              "android.permission.INTERNET",
              "android.permission.RECORD_AUDIO",
              "android.permission.MODIFY_AUDIO_SETTINGS",
              "android.permission.BLUETOOTH",
              "android.permission.BLUETOOTH_CONNECT",
              "android.permission.BLUETOOTH_SCAN",
          ]:
              tag = f'<uses-permission android:name="{perm}" />'
              if perm not in m:
                  m = m.replace("<application", tag + "\n    <application", 1)

          m = re.sub(
              r'<meta-data\s+android:name="flutter_deeplinking_enabled"\s+android:value="(?:true|false)"\s*/>',
              '<meta-data android:name="flutter_deeplinking_enabled" android:value="false" />',
              m,
          )

          activity = re.search(
              r'<activity\b[^>]*android:name="[^"]*MainActivity[^"]*"[^>]*>(.*?)</activity>',
              m,
              re.DOTALL,
          )
          if not activity:
              raise SystemExit("MainActivity block not found")

          block = activity.group(0)
          opening = re.match(r'<activity\b[^>]*>', block).group(0)
          opening = re.sub(r'\sandroid:exported="[^"]*"', '', opening)
          opening = re.sub(r'\sandroid:launchMode="[^"]*"', '', opening)
          opening = opening[:-1] + ' android:exported="true" android:launchMode="singleTask">'
          body = block[len(re.match(r'<activity\b[^>]*>', block).group(0)):]
          if 'android:scheme="io.nimzo.app"' not in body:
              body = body.replace("</activity>", '''<intent-filter>
              <action android:name="android.intent.action.VIEW" />
              <category android:name="android.intent.category.DEFAULT" />
              <category android:name="android.intent.category.BROWSABLE" />
              <data android:scheme="io.nimzo.app" android:host="login-callback" />
          </intent-filter>
          </activity>''')
          if 'android:name="flutter_deeplinking_enabled"' not in body:
              body = body.replace("</activity>", '<meta-data android:name="flutter_deeplinking_enabled" android:value="false" />\n</activity>')
          m = m[:activity.start()] + opening + body + m[activity.end():]

          if 'tools:replace="android:name"' not in m:
              m = m.replace("<application", '<application tools:replace="android:name"', 1)

          if 'android:name="flutter_deeplinking_enabled"' not in m:
              m = m.replace(
                  "<application",
                  '<application',
                  1,
              )
              app_end = m.find(">", m.find("<application"))
              m = m[:app_end+1] + '\n        <meta-data android:name="flutter_deeplinking_enabled" android:value="false" />' + m[app_end+1:]

          provider = '''<provider android:name="androidx.core.content.FileProvider" android:authorities="io.nimzo.app.apk_updates" android:exported="false" android:grantUriPermissions="true"><meta-data android:name="android.support.FILE_PROVIDER_PATHS" android:resource="@xml/nimzo_apk_paths" /></provider>'''
          m = m.replace("</application>", provider + "\n</application>")
          paths = Path("android/app/src/main/res/xml/nimzo_apk_paths.xml")
          paths.parent.mkdir(parents=True, exist_ok=True)
          paths.write_text('<paths xmlns:android="http://schemas.android.com/apk/res/android"><cache-path name="nimzo_updates" path="nimzo_updates/" /></paths>')
          manifest.write_text(m)

          # Fail fast: verify the exact OAuth contract that Supabase expects.
          final = manifest.read_text()
          assert 'application tools:replace="android:name"' in final
          assert 'android:scheme="io.nimzo.app" android:host="login-callback"' in final
          assert 'android:exported="true"' in final
          assert 'android:launchMode="singleTask"' in final
          activity_final = re.search(r'<activity\b[^>]*>.*?</activity>', final, re.DOTALL).group(0)
          assert 'android:name="flutter_deeplinking_enabled" android:value="false"' in activity_final
          print("OAuth manifest verification: PASS")
          PY

      - name: Download and verify Vivox 5.28.0
        working-directory: nimzo
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/vivox
          curl -fL --retry 3 -o /tmp/vivox/android.zip "https://github.com/adi4ch-cmd/Nimzo/releases/download/vivox-5.28.0/com.custom.android.vivox.vivoxCoreAndroidSdk-5.28.0.zip"
          echo "c30f6caf08184874a7daecc2f9c670df099fa504265dc08b51859e287a38d75f  /tmp/vivox/android.zip" | sha256sum -c -
          unzip -q /tmp/vivox/android.zip -d /tmp/vivox/android
          aar="$(find /tmp/vivox/android -type f -name 'sdk-release.aar' -print -quit)"
          header="$(find /tmp/vivox/android -type f -name 'Vxc.h' -print -quit)"
          lib="$(find /tmp/vivox/android -type f \( -name 'libvivox-sdk.so' -o -name 'libvivoxsdk.so' \) -print -quit)"
          test -n "$aar" && test -n "$header" && test -n "$lib"
          mkdir -p android/app/libs
          cp "$aar" android/app/libs/vivox-sdk-5.28.0.aar
          echo "Vivox SDK verification: PASS"

      - name: Add Vivox AAR dependency
        working-directory: nimzo
        shell: bash
        run: |
          set -euo pipefail
          g="android/app/build.gradle.kts"
          if [ ! -f "$g" ]; then g="android/app/build.gradle"; fi
          if ! grep -q "vivox-sdk-5.28.0.aar" "$g"; then
            if [[ "$g" == *.kts ]]; then
              printf '\n// Vivox Core SDK 5.28.0\ndependencies { implementation(files("libs/vivox-sdk-5.28.0.aar")) }\n' >> "$g"
            else
              printf '\n// Vivox Core SDK 5.28.0\ndependencies { implementation files("libs/vivox-sdk-5.28.0.aar") }\n' >> "$g"
            fi
          fi

      - name: Configure owner Firebase and Android notification runtime
        run: python3 tool/configure_fcm_android.py --root . --config-file tool/firebase_android_client.json
      - name: Preserve Vivox release callbacks
        run: |
          cat >> android/app/build.gradle.kts <<'GRADLE'
          android {
            buildTypes {
              getByName("release") {
                proguardFiles(getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro")
              }
            }
          }
          GRADLE
      - name: Install Flutter packages
        run: flutter pub get --enforce-lockfile
      - name: Analyzer
        run: flutter analyze --no-fatal-infos
      - name: Backend regression checks
        run: flutter test test/coming_soon_navigation_test.dart test/membership_retirement_test.dart test/family_backend_flow_test.dart test/family_repository_test.dart test/moment_media_test.dart test/moment_editor_retry_test.dart test/backend_targeted_integration_test.dart test/auth_redirect_test.dart test/logout_cleanup_test.dart test/push_notifications_test.dart test/local_push_presenter_test.dart test/notification_destination_test.dart test/voice/vivox_voice_service_test.dart
      - name: Build release-mode APK for final device QA
        run: flutter build apk --release
      - name: Build smaller ARM64 APK for physical Android phones
        run: |
          set -euo pipefail
          flutter build apk --release --split-per-abi
          ARM=build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          test -s "$ARM"
          sha256sum "$ARM" > "$ARM.sha256"
          python3 - <<'PY'
          from pathlib import Path
          import zipfile
          p=Path('build/app/outputs/flutter-apk/app-arm64-v8a-release.apk')
          with zipfile.ZipFile(p) as z:
              assert z.testzip() is None, 'Corrupted ARM64 archive'
              files=set(z.namelist())
              assert 'lib/arm64-v8a/libflutter.so' in files
              assert 'lib/arm64-v8a/libapp.so' in files
              assert 'lib/armeabi-v7a/libflutter.so' not in files
              assert 'lib/x86_64/libflutter.so' not in files
          print('ARM64 APK ZIP and ABI verified; size',p.stat().st_size)
          PY
          ATOOL="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          "$ATOOL" verify --verbose "$ARM"
      - name: Validate APK, checksum and package
        run: |
          set -euo pipefail
          APK=build/app/outputs/flutter-apk/app-release.apk
          test -s "$APK"
          python3 ../tools/verify_test_apk.py "$APK"
          python3 ../tools/verify_fcm_apk.py "$APK"
          sha256sum "$APK" > build/app/outputs/flutter-apk/app-release.apk.sha256
          printf '%s\n' "$GITHUB_SHA" > build/app/outputs/flutter-apk/source-sha.txt
          ls -lh "$APK"
          grep -n 'applicationId = "io.nimzo.app"' android/app/build.gradle.kts
      - name: Enable KVM for Android launch smoke test
        working-directory: .
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install and launch release APK on Android emulator
        id: launch
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: python3 tools/verify_android_launch.py nimzo/build/app/outputs/flutter-apk/app-release.apk
      - name: Upload verified release-mode APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: nimzo-final-release-apk
          path: |
            nimzo/build/app/outputs/flutter-apk/app-release.apk
            nimzo/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
            nimzo/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk.sha256
            nimzo/build/app/outputs/flutter-apk/app-release.apk.sha256
            nimzo/build/app/outputs/flutter-apk/app-release.apk.signing.txt
            nimzo/build/app/outputs/flutter-apk/source-sha.txt
            nimzo/build/app/outputs/flutter-apk/app-release.apk.fcm-verification.txt
          retention-days: 14
          if-no-files-found: error
      - name: Publish version 1.0.26 test APK release
        env:
          GH_TOKEN: ${{ github.token }}
        working-directory: .
        run: |
          set -euo pipefail
          TAG=nimzo-games-preview-1.0.26-126
          mkdir -p /tmp/nimzo-release
          cp nimzo/build/app/outputs/flutter-apk/app-release.apk /tmp/nimzo-release/nimzo-universal-1.0.26.apk
          cp nimzo/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk /tmp/nimzo-release/nimzo-arm64-1.0.26.apk
          (
            cd /tmp/nimzo-release
            sha256sum nimzo-universal-1.0.26.apk nimzo-arm64-1.0.26.apk > SHA256SUMS.txt
          )
          gh release create "$TAG" \
            /tmp/nimzo-release/nimzo-universal-1.0.26.apk \
            /tmp/nimzo-release/nimzo-arm64-1.0.26.apk \
            /tmp/nimzo-release/SHA256SUMS.txt \
            --target "$GITHUB_SHA" \
            --title "NIMZO 1.0.26 - Grady / Lucky 77 demo testing" \
            --notes "Prerelease for Android device testing. Grady Lion and Lucky 77 have interactive demo selections only; live wagering is NOT enabled. Romantic Blossom, Ice Queen Magic and Tiger Warrior appear as 500K Coming Soon gifts; video files are NOT in this APK because binary assets have not been uploaded. Existing Firebase, Supabase and Vivox integrations preserved. ARM64 build recommended for most modern phones. Not a production release." \
            --prerelease
      - name: Upload launch diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nimzo-release-launch-diagnostics
          path: android-launch-diagnostics/
          if-no-files-found: warn
          retention-days: 14
