name: Extract Nimzo source archive

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    if: ${{ !contains(github.event.head_commit.message, '[skip-extract]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract Nimzo source
        run: |
          set -e
          test -f Nimzo_FINAL_GitHub.zip
          rm -rf nimzo
          unzip -q Nimzo_FINAL_GitHub.zip
          test -f nimzo/pubspec.yaml
          rm Nimzo_FINAL_GitHub.zip

      - name: Commit extracted project
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Extract Nimzo project source [skip-extract]" || exit 0
          git push
