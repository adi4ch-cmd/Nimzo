name: Nimzo Android OAuth build check

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    if: ${{ !contains(github.event.head_commit.message, '[skip-build]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Generate Android platform if missing
        working-directory: nimzo
        run: |
          if [ ! -f android/app/src/main/AndroidManifest.xml ]; then
            flutter create --platforms=android --org io.nimzo .
          fi
          rm -f test/widget_test.dart

      - name: Configure Nimzo deep link
        working-directory: nimzo
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path("android/app/src/main/AndroidManifest.xml")
          s = p.read_text()

          meta = '<meta-data android:name="flutter_deeplinking_enabled" android:value="false" />'
          s = re.sub(
              r'<meta-data\s+android:name="flutter_deeplinking_enabled"\s+android:value="(?:true|false)"\s*/>',
              meta,
              s,
          )

          deep_link = '''<intent-filter>
              <action android:name="android.intent.action.VIEW" />
              <category android:name="android.intent.category.DEFAULT" />
              <category android:name="android.intent.category.BROWSABLE" />
              <data android:scheme="io.nimzo.app" android:host="login-callback" />
            </intent-filter>'''

          if 'android:scheme="io.nimzo.app"' not in s:
              main_activity = re.search(
                  r'(<activity\b[^>]*android:name="[^"]*MainActivity[^"]*"[^>]*>)(.*?)(</activity>)',
                  s,
                  re.DOTALL,
              )
              if not main_activity:
                  raise SystemExit("MainActivity block not found in generated AndroidManifest.xml")
              replacement = (
                  main_activity.group(1)
                  .replace('android:launchMode="standard"', '')
                  .replace('android:exported="false"', '')
                  + main_activity.group(2).rstrip()
                  + "\n            "
                  + deep_link
                  + "\n        "
                  + main_activity.group(3)
              )
              s = s[:main_activity.start()] + replacement + s[main_activity.end():]

          if meta not in s:
              main_activity = re.search(
                  r'(<activity\b[^>]*android:name="[^"]*MainActivity[^"]*"[^>]*>)(.*?)(</activity>)',
                  s,
                  re.DOTALL,
              )
              if not main_activity:
                  raise SystemExit("MainActivity block not found while adding deep-link flag")
              replacement = (
                  main_activity.group(1)
                  + "\n            "
                  + meta
                  + main_activity.group(2)
                  + main_activity.group(3)
              )
              s = s[:main_activity.start()] + replacement + s[main_activity.end():]

          # Make OAuth callback delivery deterministic when the browser returns to an
          # already-running Nimzo process. Preserve/replace existing activity attributes
          # rather than creating duplicate XML attributes.
          main_activity = re.search(
              r'<activity\b[^>]*android:name="[^"]*MainActivity[^"]*"[^>]*>',
              s,
              re.DOTALL,
          )
          if not main_activity:
              raise SystemExit("MainActivity block not found while configuring launch mode")
          tag = main_activity.group(0)
          tag = re.sub(r'\sandroid:exported="[^"]*"', '', tag)
          tag = re.sub(r'\sandroid:launchMode="[^"]*"', '', tag)
          tag = tag[:-1] + ' android:exported="true" android:launchMode="singleTask">'
          s = s[:main_activity.start()] + tag + s[main_activity.end():]

          p.write_text(s)
          PY

      - name: Dependencies
        working-directory: nimzo
        run: flutter pub get

      - name: Analyze
        working-directory: nimzo
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Tests
        working-directory: nimzo
        run: flutter test

      - name: Build APK
        working-directory: nimzo
        run: |
          flutter build apk --release \
            --dart-define=SUPABASE_URL=https://kvqvlpozqokwarovwmwv.supabase.co

      - uses: actions/upload-artifact@v4
        with:
          name: nimzo-oauth-fixed-apk
          path: nimzo/build/app/outputs/flutter-apk/app-release.apk
