name: Nimzo Android OAuth build check

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    if: ${{ !contains(github.event.head_commit.message, '[skip-build]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Generate Android platform if missing
        working-directory: nimzo
        run: |
          if [ ! -f android/app/src/main/AndroidManifest.xml ]; then
            flutter create --platforms=android --org io.nimzo .
          fi
          rm -f test/widget_test.dart

      - name: Configure Nimzo deep link
        working-directory: nimzo
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path("android/app/src/main/AndroidManifest.xml")
          s=p.read_text()
          marker='<action android:name="android.intent.action.MAIN" />'
          block='''<meta-data android:name="flutter_deeplinking_enabled" android:value="true" />
            <intent-filter>
              <action android:name="android.intent.action.VIEW" />
              <category android:name="android.intent.category.DEFAULT" />
              <category android:name="android.intent.category.BROWSABLE" />
              <data android:scheme="io.nimzo.app" android:host="login-callback" />
            </intent-filter>
            '''
          if 'android:scheme="io.nimzo.app"' not in s:
              if marker not in s:
                  raise SystemExit("Flutter Android manifest MAIN activity marker not found")
              s=s.replace(marker, marker+"\n            "+block.strip(), 1)
          p.write_text(s)
          PY

      - name: Dependencies
        working-directory: nimzo
        run: flutter pub get

      - name: Analyze
        working-directory: nimzo
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Tests
        working-directory: nimzo
        run: flutter test

      - name: Build APK
        working-directory: nimzo
        run: |
          # The client publishable key has a safe source fallback in AppConstants.
          # Do not pass an empty/missing GitHub secret, which overrides that fallback
          # and causes Supabase Auth to fail with "No API key found".
          flutter build apk --release \
            --dart-define=SUPABASE_URL=https://kvqvlpozqokwarovwmwv.supabase.co

      - uses: actions/upload-artifact@v4
        with:
          name: nimzo-oauth-fixed-apk
          path: nimzo/build/app/outputs/flutter-apk/app-release.apk

# Verification build trigger after Supabase key fallback fix.
