name: NIMZO Room and Profile Layout QA
on:
  push:
    branches:
      - fix/room-profile-premium-layout-20261024
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  flutter-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.6'
          channel: stable
          cache: true
      - name: Restore locked dependencies
        working-directory: nimzo
        run: flutter pub get --enforce-lockfile
      - name: Analyze complete app
        working-directory: nimzo
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - name: Room, profile and membership layout regression
        working-directory: nimzo
        run: |
          flutter test --reporter expanded \
            test/room_profile_premium_layout_test.dart \
            test/room_user_sheet_test.dart \
            test/profile_content_test.dart \
            test/membership_pack_runtime_test.dart
