name: NIMZO Real Store and Room Gifts QA
on:
  push:
    branches: [feature/real-store-room-gifts-20261020]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.6'
          channel: stable
          cache: true
      - run: python3 tools/verify_nimzo_feature_lock.py
      - run: flutter pub get
        working-directory: nimzo
      - name: Store and gift behavior regressions
        run: flutter test --reporter expanded test/store_original_media_render_test.dart test/gift_animation_availability_test.dart test/verified_gift_broadcast_test.dart
        working-directory: nimzo
      - run: flutter analyze --no-fatal-infos
        working-directory: nimzo
      - name: Full regression suite
        run: flutter test --reporter expanded > ../full-test-output.txt 2>&1
        working-directory: nimzo
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: real-store-source-test-evidence
          path: |
            full-test-output.txt
            nimzo/test/failures/
          if-no-files-found: ignore
