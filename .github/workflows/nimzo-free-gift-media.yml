name: NIMZO free gift media import (no APK)

on:
  push:
    branches: [feature/profile-reference-redesign]
    paths:
      - '.github/workflows/nimzo-free-gift-media.yml'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  import-media:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Install verified MIT-licensed Rocket and Sports Car originals
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          import urllib.request
          import zlib
          import struct

          dest = Path("nimzo/assets/free_gifts")
          dest.mkdir(parents=True, exist_ok=True)
          sources = {
            "rocket.svga": (
              "https://raw.githubusercontent.com/AgoraIO-Usecase/agora-live/0651c5f04f965015221232afc2a1e834287f65bc/Android/scenes/voice/src/main/assets/animation_of_rocket.svga",
              "437169c38893c0f2150138eebcdc71b157ce6a44",
              2171721,
            ),
            "sports_car.svga": (
              "https://raw.githubusercontent.com/Tencent-RTC/TUILiveKit/c00fa47f3b2cfd29268c811c169b8cd91a95b8e7/Flutter/live_uikit_gift/assets/svga/sports_car.svga",
              "7b5ce3b1fdb1915bfb872a30735ff7c7259d069d",
              12487325,
            ),
          }
          for name, (url, expected, size) in sources.items():
            with urllib.request.urlopen(url, timeout=90) as response:
              data = response.read(size + 1)
            if len(data) != size:
              raise ValueError(f"Unexpected SVGA file size: {name} ({len(data)})")
            sha = hashlib.sha1(f"blob {len(data)}\0".encode() + data).hexdigest()
            if sha != expected:
              raise ValueError(f"SHA-1 mismatch for upstream original: {name}")
            try:
              decoded = zlib.decompress(data)
            except Exception as e:
              raise ValueError(f"SVGA payload cannot be decompressed: {name}") from e
            if len(decoded) < 1000:
              raise ValueError("Not a valid animation")
            (dest / name).write_bytes(data)
            print(name, "verified", size, "bytes; inflated", len(decoded), "bytes")

          # The true gift artwork for Sports Car is embedded as a PNG sprite
          # inside the source SVGA. We do not fabricate a car icon.
          decoded = zlib.decompress((dest / "sports_car.svga").read_bytes())
          signature = b"\x89PNG\r\n\x1a\n"
          candidates = []
          pos = 0
          while True:
            pos = decoded.find(signature, pos)
            if pos < 0:
              break
            start = pos
            ptr = start + 8
            while ptr + 12 <= len(decoded):
              block_size = struct.unpack(">I", decoded[ptr:ptr+4])[0]
              if block_size > 50_000_000:
                break
              tag = decoded[ptr+4:ptr+8]
              ptr += 12 + block_size
              if tag == b"IEND":
                data = decoded[start:ptr]
                if data.startswith(signature):
                  w,h = struct.unpack(">II",data[16:24])
                  if 48 <= w <= 2048 and 48 <= h <= 2048:
                    candidates.append((w*h, w, h, len(data), data))
                break
            pos = start + 8
          candidates.sort(key=lambda v:v[0], reverse=True)
          print("Embedded Sports Car SVGA PNG sprite candidates:",[(w,h,b) for _,w,h,b,_ in candidates[:12]])
          # Sprite file is useful for visual QA and only shipped if validated.
          if candidates:
            (dest / "sports_car_sprite.png").write_bytes(candidates[0][-1])
          else:
            raise ValueError("No valid PNG artwork in source SVGA")
          PY
      - name: Store original media and copyright notice in git
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add nimzo/assets/free_gifts/rocket.svga nimzo/assets/free_gifts/sports_car.svga nimzo/assets/free_gifts/sports_car_sprite.png
          if git diff --cached --quiet; then
            echo 'No changes to free original gift media'
            exit 0
          fi
          git commit -m 'assets(gifts): import verified MIT Rocket/Sports Car SVGA files [gifts-only]'
          git push
