name: Check Yo2 original media download source (no APK build)

on:
  push:
    branches: [feature/profile-reference-redesign]
    paths:
      - .github/workflows/nimzo-yo2-source-probe.yml

permissions:
  contents: read

jobs:
  check-source:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Probe HTTPS download metadata (no binary download)
        shell: bash
        run: |
          set +e
          for candidate in             'https://d.apkpure.com/b/XAPK/com.yotwo.sealion?version=1.32.0'             'https://d.apkpure.com/b/XAPK/com.yotwo.sealion?version=latest'; do
            echo "Checking Yo2 v1.32.0 source"
            curl --compressed -sS -I -L --max-time 30 --retry 1               --user-agent 'Mozilla/5.0 (compatible; NIMZO-AssetVerification/1.0)'               -w 'status=%{http_code} type=%{content_type} bytes=%{size_download}\n'               -o /tmp/nimzo-yo2-headers "$candidate"
            grep -iE '^(HTTP/|content-type:|content-length:|content-disposition:)'               /tmp/nimzo-yo2-headers | tail -8 || true
          done
          exit 0
