name: NIMZO APK Store Candidate Audit (No APK)

on:
  push:
    branches:
      - feature/store-apk-verified-assets-20261021
    paths:
      - tools/stage_apk_store_assets.py
      - tools/test_stage_apk_store_assets.py
      - .github/workflows/nimzo-store-apk-candidate-audit.yml
      - nimzo/lib/features/store/store_live_catalog.dart
      - nimzo/test/store_media_integrity_test.dart
      - docs/validation/store-apk-candidate-review.md
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: store-apk-candidate-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Verify Python and nested APK fixture safety
        run: |
          python3 -m py_compile tools/stage_apk_store_assets.py
          python3 -m unittest discover -s tools -p test_stage_apk_store_assets.py -v
      - name: Recheck existing pinned complete Store files and checksums
        run: |
          python3 - <<'PY'
          import hashlib, json
          from pathlib import Path
          rows=json.loads(Path('nimzo/assets/premium_store/manifest.json').read_text())
          checked=0
          for r in rows:
              asset=Path('nimzo') / r['asset']
              assert asset.is_file(), f"Missing pinned asset: {asset}"
              assert hashlib.sha256(asset.read_bytes()).hexdigest() == r['sha256'], f"Corrupt pinned asset: {asset}"
              if r.get('thumbnail'):
                  thumb=Path('nimzo') / r['thumbnail']
                  assert thumb.is_file(), f"Missing preview: {thumb}"
              checked+=1
          print(f'PASS: {checked} previously integrated Store source media exact hash matches.')
          PY
      - name: Scan available original 91k audit metadata without inserting Store items
        run: |
          python3 tools/stage_apk_store_assets.py \
            --use-full-audit \
            --report "$RUNNER_TEMP/store-apk-candidates-dry-run.json"
      - name: Summarize credible Store media candidates by category
        run: |
          python3 - <<'PY'
          import json
          from collections import defaultdict
          from pathlib import Path
          path=Path('${{ runner.temp }}/store-apk-candidates-dry-run.json')
          data=json.loads(path.read_text())
          grouped=defaultdict(list)
          for row in data['entries']:
              if row.get('proposed_store_category'):
                  grouped[row['proposed_store_category']].append(row)
          for category,items in sorted(grouped.items()):
              print(f"CATEGORY {category}: {len(items)} unique source-hash candidates")
              for item in items[:12]:
                  print("  SOURCE",item.get('source_package'),
                        item.get('source'), "bytes",item.get('bytes'),
                        "sha256",item.get('sha256'))
          PY
      - name: Set up Flutter for Store integrity QA
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.6'
          channel: stable
          cache: true
      - name: Verify Store never fabricates incomplete products
        working-directory: nimzo
        run: |
          flutter pub get --enforce-lockfile
          flutter analyze --no-fatal-infos --no-fatal-warnings \
            lib/features/store/store_live_catalog.dart \
            test/store_media_integrity_test.dart
          flutter test --reporter expanded \
            test/store_media_integrity_test.dart \
            test/store_live_contract_test.dart \
            test/store_actual_media_test.dart \
            test/store_equipment_surfaces_test.dart \
            test/store_paid_purchase_test.dart
      - name: Preserve source-matched candidate review artifact
        uses: actions/upload-artifact@v4
        with:
          name: NIMZO-APKS-STORE-REVIEW-ONLY
          path: ${{ runner.temp }}/store-apk-candidates-dry-run.json
          retention-days: 14
