name: NIMZO one-time visual reference verification

on:
  push:
    branches: [feature/profile-reference-redesign]
    paths:
      - .github/workflows/nimzo-update-svip-goldens-once.yml

permissions:
  contents: write

jobs:
  verify-and-refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.6'
          channel: stable
      - name: Resolve project dependencies
        working-directory: nimzo
        run: flutter pub get
      - name: Confirm gift refresh behavior independently
        working-directory: nimzo
        run: flutter test test/moment_gift_refresh_test.dart
      - name: Render canonical goldens for real SVIP asset replacement
        working-directory: nimzo
        run: flutter test --update-goldens test/master_visual_preview_test.dart test/remaining_visual_qa_test.dart
      - name: Guard approved screenshot changes and upload refreshed references
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import subprocess
          allowed = {
            'nimzo/test/goldens/vip_final.png',
            'nimzo/test/goldens/svip_final.png',
            'nimzo/test/goldens/remaining/moments.png',
            'nimzo/test/goldens/remaining/gifts.png',
            'nimzo/test/goldens/remaining/public_profile.png'
          }
          changed = set(subprocess.check_output(
            ['git','diff','--name-only','--','nimzo/test/goldens'],text=True
          ).splitlines())
          print('CHANGED_GOLDENS:', sorted(changed))
          unexpected = changed - allowed
          if unexpected:
              raise SystemExit(f'Unexpected UI reference changes: {sorted(unexpected)}')
          PY
          git add nimzo/test/goldens/vip_final.png nimzo/test/goldens/svip_final.png nimzo/test/goldens/remaining/moments.png nimzo/test/goldens/remaining/gifts.png nimzo/test/goldens/remaining/public_profile.png
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "test: lock Hilo SVIP design into NIMZO visual references"
            git push origin HEAD:feature/profile-reference-redesign
          fi
