name: VIP/SVIP removal regression checks
on:
  push:
    branches: [fix/remove-vip-svip-all-20261016]
  pull_request:
    paths:
      - 'nimzo/lib/**'
      - 'nimzo/test/**'
      - 'nimzo/pubspec.yaml'
      - 'supabase/migrations/*remove_all_vip_svip_user_state.sql'
      - 'tools/tests/membership_removal_test.py'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.6'
          channel: stable
          cache: true
      - name: Verify all retired membership UI and assets are absent
        run: python3 -m unittest discover -s tools/tests -p membership_removal_test.py
      - name: Flutter dependencies
        working-directory: nimzo
        run: flutter pub get
      - name: Flutter static analysis
        working-directory: nimzo
        run: flutter analyze
      - name: All Flutter tests
        working-directory: nimzo
        run: flutter test
