name: NIMZO Zodiac Gift 100K Source QA (NO APK)

on:
  push:
    branches:
      - feature/libra-aries-gifts-100k-20261018
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  zodiac-source-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: nimzo
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.6'
          channel: stable
          cache: true
      - name: Resolve Flutter dependencies
        run: flutter pub get
      - name: Dart and Flutter analyzer
        run: flutter analyze --no-fatal-infos
      - name: Verify zodiac IDs, icons, prices and approved gift event routing
        run: |
          flutter test test/zodiac_gift_100k_contract_test.dart
          flutter test test/hall_of_fame_gift_contract_test.dart
          flutter test test/verified_gift_broadcast_test.dart
      - name: No APK build, no live release
        run: echo "Source-only: no build, no publication, and no wallet changes."
