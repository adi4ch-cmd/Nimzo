name: NIMZO ByChance-Inspired UI Check

on:
  push:
    branches:
      - feature/bychance-inspired-ui-20261016
  workflow_dispatch:

permissions:
  contents: read

jobs:
  flutter-ui-check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.6'
          channel: stable
          cache: true
      - name: Resolve packages
        working-directory: nimzo
        run: flutter pub get
      - name: Analyze Dart sources
        working-directory: nimzo
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - name: Verify colors and UI galleries
        working-directory: nimzo
        run: flutter test test/bychance_palette_test.dart test/bychance_ui_smoke_test.dart
