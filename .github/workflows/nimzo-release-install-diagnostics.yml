name: Diagnose published NIMZO installation on Android15
on:
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  android15-install:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Download exact published APKs without rebuilding
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p released/old released/current diagnostics
          gh release download nimzo-v3-dynamic-1.0.40-39910959143 --pattern '*.apk' --dir released/old
          gh release download nimzo-v3-dynamic-1.0.41-39981108199 --pattern '*.apk' --dir released/current
          sha256sum released/*/*.apk | tee diagnostics/checksums.txt
          ATOOL=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)
          "$ATOOL" verify --verbose --print-certs released/current/*.apk | tee diagnostics/signature.txt
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: bash tools/diagnose_release_install.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android15-install-diagnostics
          path: diagnostics/
          if-no-files-found: error
