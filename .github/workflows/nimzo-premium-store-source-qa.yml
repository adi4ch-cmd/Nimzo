name: NIMZO Premium Store Source QA
on:
  push:
    branches:
      - feature/real-premium-store-assets-integration
      - integration/nimzo-audit-20261020
  workflow_dispatch:
    inputs:
      refresh_goldens:
        description: Regenerate Flutter goldens and upload them for visual review
        required: false
        default: false
        type: boolean
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.6'
          channel: stable
          cache: true
      - run: python3 tools/verify_nimzo_feature_lock.py
      - run: flutter pub get
        working-directory: nimzo
      - run: flutter analyze --no-fatal-infos
        working-directory: nimzo
      - run: |
          if [[ "$REFRESH_GOLDENS" == "true" || "$GITHUB_REF_NAME" == "integration/nimzo-audit-20261020" ]]; then
            flutter test --update-goldens --reporter expanded
          else
            flutter test --reporter expanded
          fi
        working-directory: nimzo
        env:
          REFRESH_GOLDENS: ${{ inputs.refresh_goldens }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: premium-store-test-evidence
          path: |
            nimzo/test-evidence/
            nimzo/test/goldens/
            nimzo/test/failures/
          if-no-files-found: ignore
