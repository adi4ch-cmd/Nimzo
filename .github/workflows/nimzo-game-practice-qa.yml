name: NIMZO Games Practice QA

on:
  push:
    branches:
      - feature/games-grady-practice-20261018
  pull_request:
    branches:
      - feature/tingle-ui-rebuild-20261017

permissions:
  contents: read

jobs:
  grady-practice:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: nimzo
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.6'
          channel: stable
          cache: true
      - name: Install Flutter packages
        run: flutter pub get
      - name: Analyze code
        run: flutter analyze --no-fatal-infos
      - name: Verify Grady Lion selection, practice and existing game layouts
        run: |
          flutter test --reporter expanded \
            test/grady_lion_practice_test.dart \
            test/game_catalog_test.dart \
            test/game_layout_test.dart \
            test/room_game_host_test.dart
