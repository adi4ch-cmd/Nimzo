name: NIMZO Full Regression Audit

on:
  push:
    branches:
      - feature/willchill-premium-assets-20261020
    paths:
      - nimzo/lib/**
      - nimzo/test/**
      - nimzo/pubspec.yaml
      - .github/workflows/willchill-full-regression.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Flutter 3.47.6
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.6'
          channel: stable
          cache: true
      - name: Fetch Flutter dependencies
        working-directory: nimzo
        run: flutter pub get
      - name: Analyze all Dart code
        working-directory: nimzo
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - name: All Flutter tests
        working-directory: nimzo
        run: flutter test --reporter expanded
