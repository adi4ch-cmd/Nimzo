name: Nimzo Vivox Android Build
# OAuth deep-link fix included for release APK

on:
  workflow_dispatch:
  push:
    branches:
      - feat/vivox-5.28-android-ci
  pull_request:
    branches:
      - main

jobs:
  build-vivox-android:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android platform
        working-directory: nimzo
        run: flutter create --platforms=android --project-name nimzo .

      - name: Install Nimzo Vivox Android host and native bridge
        working-directory: nimzo
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p android/app/src/main/java/io/nimzo/app
          mkdir -p android/app/src/main/java/io/nimzo/vivox
          mkdir -p android/app/src/main/cpp
          cp native/vivox/android/MainActivity.java android/app/src/main/java/io/nimzo/app/MainActivity.java
          cp native/vivox/android/NimzoVivox.java android/app/src/main/java/io/nimzo/vivox/NimzoVivox.java
          cp native/vivox/android/vivox_bridge.cpp android/app/src/main/cpp/vivox_bridge.cpp
          cp native/vivox/android/CMakeLists.txt android/app/src/main/cpp/CMakeLists.txt

      - name: Configure Android application id, permissions, and native build
        working-directory: nimzo
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          gradle = Path("android/app/build.gradle.kts")
          if not gradle.exists():
              gradle = Path("android/app/build.gradle")
          if not gradle.exists():
              raise SystemExit("Generated Android app Gradle file not found")

          s = gradle.read_text()
          if gradle.suffix == ".kts":
              s = re.sub(r'namespace\s*=\s*"[^"]+"', 'namespace = "io.nimzo.app"', s, count=1)
              s = re.sub(r'applicationId\s*=\s*"[^"]+"', 'applicationId = "io.nimzo.app"', s, count=1)
              s += '''
\n// Nimzo Vivox Core 5.28.0 native bridge
android {
    externalNativeBuild {
        cmake {
            path = file("src/main/cpp/CMakeLists.txt")
            version = "3.22.1"
            arguments += listOf("-DVIVOX_SDK_ROOT=/tmp/vivox/android")
        }
    }
}
'''
          else:
              s = re.sub(r'namespace\s+["\'][^"\']+["\']', 'namespace "io.nimzo.app"', s, count=1)
              s = re.sub(r'applicationId\s+["\'][^"\']+["\']', 'applicationId "io.nimzo.app"', s, count=1)
              s += '''
\n// Nimzo Vivox Core 5.28.0 native bridge
android {
    externalNativeBuild {
        cmake {
            path file("src/main/cpp/CMakeLists.txt")
            version "3.22.1"
            arguments "-DVIVOX_SDK_ROOT=/tmp/vivox/android"
        }
    }
}
'''
          gradle.write_text(s)

          manifest = Path("android/app/src/main/AndroidManifest.xml")
          m = manifest.read_text()
          if 'xmlns:tools=' not in m:
              m = m.replace('<manifest', '<manifest xmlns:tools="http://schemas.android.com/tools"', 1)
          if 'tools:replace="android:name"' not in m:
              m = m.replace('<application', '<application tools:replace="android:name"', 1)
          permissions = [
              'android.permission.RECORD_AUDIO',
              'android.permission.MODIFY_AUDIO_SETTINGS',
              'android.permission.BLUETOOTH',
              'android.permission.BLUETOOTH_CONNECT',
              'android.permission.BLUETOOTH_SCAN',
          ]
          for p in permissions:
              tag = f'<uses-permission android:name="{p}" />'
              if p not in m:
                  m = m.replace('<application', tag + '\n        <application', 1)
          manifest.write_text(m)
          PY

      - name: Configure Nimzo OAuth deep link
        working-directory: nimzo
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path("android/app/src/main/AndroidManifest.xml")
          s = p.read_text()

          meta = '<meta-data android:name="flutter_deeplinking_enabled" android:value="false" />'
          s = re.sub(
              r'<meta-data\s+android:name="flutter_deeplinking_enabled"\s+android:value="(?:true|false)"\s*/>',
              meta,
              s,
          )

          deep_link = '''<intent-filter>
              <action android:name="android.intent.action.VIEW" />
              <category android:name="android.intent.category.DEFAULT" />
              <category android:name="android.intent.category.BROWSABLE" />
              <data android:scheme="io.nimzo.app" android:host="login-callback" />
            </intent-filter>'''

          activity = re.search(
              r'<activity\b[^>]*android:name="[^"]*MainActivity[^"]*"[^>]*>.*?</activity>',
              s,
              re.DOTALL,
          )
          if not activity:
              raise SystemExit("MainActivity block not found")

          block = activity.group(0)
          tag_match = re.match(r'<activity\b[^>]*>', block)
          tag = tag_match.group(0)
          body = block[len(tag):]

          tag = re.sub(r'\sandroid:exported="[^"]*"', '', tag)
          tag = re.sub(r'\sandroid:launchMode="[^"]*"', '', tag)
          tag = tag[:-1] + ' android:exported="true" android:launchMode="singleTask">'
          if 'android:scheme="io.nimzo.app"' not in body:
              body = body.rstrip() + "\n            " + deep_link
          if meta not in body:
              body = "\n            " + meta + body

          new_block = tag + body
          s = s[:activity.start()] + new_block + s[activity.end():]
          p.write_text(s)
          PY

      - name: Download Vivox Android SDK 5.28.0
        working-directory: nimzo
        run: |
          set -euo pipefail
          mkdir -p /tmp/vivox
          curl -fL --retry 3 -o /tmp/vivox/android.zip "https://github.com/adi4ch-cmd/Nimzo/releases/download/vivox-5.28.0/com.custom.android.vivox.vivoxCoreAndroidSdk-5.28.0.zip"
          echo "c30f6caf08184874a7daecc2f9c670df099fa504265dc08b51859e287a38d75f  /tmp/vivox/android.zip" | sha256sum -c -
          unzip -q /tmp/vivox/android.zip -d /tmp/vivox/android
          AAR="$(find /tmp/vivox/android -type f -name 'sdk-release.aar' -print -quit)"
          test -n "$AAR"
          mkdir -p android/app/libs
          cp "$AAR" android/app/libs/vivox-sdk-5.28.0.aar
          HEADER="$(find /tmp/vivox/android -type f -name 'Vxc.h' -print -quit)"
          test -n "$HEADER"
          VIVOX_LIB="$(find /tmp/vivox/android -type f \( -name 'libvivox-sdk.so' -o -name 'libvivoxsdk.so' \) -print -quit)"
          test -n "$VIVOX_LIB"
          echo "Vivox header: $HEADER"
          echo "Vivox native library: $VIVOX_LIB"

      - name: Wire Vivox AAR dependency
        working-directory: nimzo
        shell: bash
        run: |
          set -euo pipefail
          APP_GRADLE=""
          if [ -f android/app/build.gradle ]; then
            APP_GRADLE=android/app/build.gradle
          elif [ -f android/app/build.gradle.kts ]; then
            APP_GRADLE=android/app/build.gradle.kts
          else
            exit 1
          fi
          if ! grep -q "vivox-sdk-5.28.0.aar" "$APP_GRADLE"; then
            if [[ "$APP_GRADLE" == *.kts ]]; then
              printf '\n// Vivox Core SDK 5.28.0\ndependencies {\n    implementation(files("libs/vivox-sdk-5.28.0.aar"))\n}\n' >> "$APP_GRADLE"
            else
              printf '\n// Vivox Core SDK 5.28.0\ndependencies {\n    implementation files("libs/vivox-sdk-5.28.0.aar")\n}\n' >> "$APP_GRADLE"
            fi
          fi

      - name: Remove generated sample test
        working-directory: nimzo
        run: rm -f test/widget_test.dart

      - name: Flutter pub get
        working-directory: nimzo
        run: flutter pub get

      - name: Flutter analyze
        working-directory: nimzo
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Build release APK with Vivox native bridge
        working-directory: nimzo
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: nimzo-vivox-5.28.0-release-apk
          path: nimzo/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
