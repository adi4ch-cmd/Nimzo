name: NIMZO Verified Repair Test APK

on:
  workflow_dispatch:
    inputs:
      publish_verified_run:
        description: 'Publish artifacts from an already successful test APK run; leave blank to build'
        required: false
        type: string
        default: ''

permissions:
  contents: read

jobs:
  android-test:
    if: ${{ inputs.publish_verified_run == '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Flutter 3.47.7
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.7"
          channel: stable
          cache: true

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Install native build tools
        run: sdkmanager 'cmake;3.22.1'

      - name: Generate Android project
        working-directory: nimzo
        run: |
          set -euo pipefail
          flutter create --no-pub --platforms=android --project-name nimzo .
          git restore --source=HEAD -- pubspec.lock
          git diff --exit-code -- pubspec.yaml
          rm -f test/widget_test.dart

      - name: Configure API 36 compatible Android toolchain
        working-directory: nimzo
        run: python3 ../tools/configure_android_gradle.py android

      - name: Configure Firebase Cloud Messaging
        working-directory: nimzo
        run: python3 tool/configure_fcm_android.py --root . --config-file tool/firebase_android_client.json

      - name: Install Vivox Android bridge
        working-directory: nimzo
        shell: bash
        run: |
          set -euo pipefail
          find android/app/src/main/kotlin -name MainActivity.kt -delete
          mkdir -p android/app/src/main/java/io/nimzo/app
          mkdir -p android/app/src/main/java/io/nimzo/vivox
          mkdir -p android/app/src/main/cpp
          mkdir -p android/app/src/main/res/drawable
          cp native/vivox/android/nimzo_launcher.xml android/app/src/main/res/drawable/nimzo_launcher.xml
          cp assets/brand/nimzo_purple_gold.png android/app/src/main/res/drawable/nimzo_brand_icon.png
          cp native/vivox/android/proguard-rules.pro android/app/proguard-rules.pro
          cp native/vivox/android/NimzoUpdate.java android/app/src/main/java/io/nimzo/app/NimzoUpdate.java
          cp native/vivox/android/MainActivity.java android/app/src/main/java/io/nimzo/app/MainActivity.java
          cp native/vivox/android/NimzoVivox.java android/app/src/main/java/io/nimzo/vivox/NimzoVivox.java
          cp native/vivox/android/vivox_bridge.cpp android/app/src/main/cpp/vivox_bridge.cpp
          cp native/vivox/android/CMakeLists.txt android/app/src/main/cpp/CMakeLists.txt

      - name: Configure Android ID permissions and OAuth callback
        working-directory: nimzo
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          gradle = Path("android/app/build.gradle.kts")
          if not gradle.exists():
              gradle = Path("android/app/build.gradle")
          s = gradle.read_text()

          if gradle.suffix == ".kts":
              s = re.sub(r'namespace\s*=\s*"[^"]+"', 'namespace = "io.nimzo.app"', s, count=1)
              s = re.sub(r'applicationId\s*=\s*"[^"]+"', 'applicationId = "io.nimzo.app"', s, count=1)
          s += '''
          // Nimzo Vivox native bridge
          android {
              defaultConfig {
                  externalNativeBuild {
                      cmake {
                          arguments.add("-DVIVOX_SDK_ROOT=/tmp/vivox/android")
                      }
                  }
              }
              externalNativeBuild {
                  cmake {
                      path = file("src/main/cpp/CMakeLists.txt")
                      version = "3.22.1"
                  }
              }
          }
          '''
          gradle.write_text(s)

          manifest = Path("android/app/src/main/AndroidManifest.xml")
          m = manifest.read_text()
          m = re.sub(r'android:label="[^"]+"', 'android:label="Nimzo"', m, count=1)
          m = re.sub(r'android:icon="[^"]+"', 'android:icon="@drawable/nimzo_launcher"', m, count=1)
          if "xmlns:tools=" not in m:
              m = m.replace("<manifest", '<manifest xmlns:tools="http://schemas.android.com/tools"', 1)

          for perm in [
              "android.permission.REQUEST_INSTALL_PACKAGES",
              "android.permission.INTERNET",
              "android.permission.RECORD_AUDIO",
              "android.permission.MODIFY_AUDIO_SETTINGS",
              "android.permission.BLUETOOTH",
              "android.permission.BLUETOOTH_CONNECT",
              "android.permission.BLUETOOTH_SCAN",
          ]:
              tag = f'<uses-permission android:name="{perm}" />'
              if perm not in m:
                  m = m.replace("<application", tag + "\n    <application", 1)

          m = re.sub(
              r'<meta-data\s+android:name="flutter_deeplinking_enabled"\s+android:value="(?:true|false)"\s*/>',
              '<meta-data android:name="flutter_deeplinking_enabled" android:value="false" />',
              m,
          )

          activity = re.search(
              r'<activity\b[^>]*android:name="[^"]*MainActivity[^"]*"[^>]*>(.*?)</activity>',
              m,
              re.DOTALL,
          )
          if not activity:
              raise SystemExit("MainActivity block not found")

          block = activity.group(0)
          opening = re.match(r'<activity\b[^>]*>', block).group(0)
          opening = re.sub(r'\sandroid:exported="[^"]*"', '', opening)
          opening = re.sub(r'\sandroid:launchMode="[^"]*"', '', opening)
          opening = opening[:-1] + ' android:exported="true" android:launchMode="singleTask">'
          body = block[len(re.match(r'<activity\b[^>]*>', block).group(0)):]
          if 'android:scheme="io.nimzo.app"' not in body:
              body = body.replace("</activity>", '''<intent-filter>
              <action android:name="android.intent.action.VIEW" />
              <category android:name="android.intent.category.DEFAULT" />
              <category android:name="android.intent.category.BROWSABLE" />
              <data android:scheme="io.nimzo.app" android:host="login-callback" />
          </intent-filter>
          </activity>''')
          if 'android:name="flutter_deeplinking_enabled"' not in body:
              body = body.replace("</activity>", '<meta-data android:name="flutter_deeplinking_enabled" android:value="false" />\n</activity>')
          m = m[:activity.start()] + opening + body + m[activity.end():]

          if 'tools:replace="android:name"' not in m:
              m = m.replace("<application", '<application tools:replace="android:name"', 1)

          if 'android:name="flutter_deeplinking_enabled"' not in m:
              m = m.replace(
                  "<application",
                  '<application',
                  1,
              )
              app_end = m.find(">", m.find("<application"))
              m = m[:app_end+1] + '\n        <meta-data android:name="flutter_deeplinking_enabled" android:value="false" />' + m[app_end+1:]

          provider = '''<provider android:name="androidx.core.content.FileProvider" android:authorities="io.nimzo.app.apk_updates" android:exported="false" android:grantUriPermissions="true"><meta-data android:name="android.support.FILE_PROVIDER_PATHS" android:resource="@xml/nimzo_apk_paths" /></provider>'''
          m = m.replace("</application>", provider + "\n</application>")
          paths = Path("android/app/src/main/res/xml/nimzo_apk_paths.xml")
          paths.parent.mkdir(parents=True, exist_ok=True)
          paths.write_text('<paths xmlns:android="http://schemas.android.com/apk/res/android"><cache-path name="nimzo_updates" path="nimzo_updates/" /></paths>')
          manifest.write_text(m)

          # Fail fast: verify the exact OAuth contract that Supabase expects.
          final = manifest.read_text()
          assert 'application tools:replace="android:name"' in final
          assert 'android:scheme="io.nimzo.app" android:host="login-callback"' in final
          assert 'android:exported="true"' in final
          assert 'android:launchMode="singleTask"' in final
          activity_final = re.search(r'<activity\b[^>]*>.*?</activity>', final, re.DOTALL).group(0)
          assert 'android:name="flutter_deeplinking_enabled" android:value="false"' in activity_final
          print("OAuth manifest verification: PASS")
          PY

      - name: Download and verify Vivox 5.28.0
        working-directory: nimzo
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/vivox
          curl -fL --retry 3 -o /tmp/vivox/android.zip "https://github.com/adi4ch-cmd/Nimzo/releases/download/vivox-5.28.0/com.custom.android.vivox.vivoxCoreAndroidSdk-5.28.0.zip"
          echo "c30f6caf08184874a7daecc2f9c670df099fa504265dc08b51859e287a38d75f  /tmp/vivox/android.zip" | sha256sum -c -
          unzip -q /tmp/vivox/android.zip -d /tmp/vivox/android
          aar="$(find /tmp/vivox/android -type f -name 'sdk-release.aar' -print -quit)"
          header="$(find /tmp/vivox/android -type f -name 'Vxc.h' -print -quit)"
          lib="$(find /tmp/vivox/android -type f \( -name 'libvivox-sdk.so' -o -name 'libvivoxsdk.so' \) -print -quit)"
          test -n "$aar" && test -n "$header" && test -n "$lib"
          mkdir -p android/app/libs
          cp "$aar" android/app/libs/vivox-sdk-5.28.0.aar
          echo "Vivox SDK verification: PASS"

      - name: Add Vivox AAR dependency
        working-directory: nimzo
        shell: bash
        run: |
          set -euo pipefail
          g="android/app/build.gradle.kts"
          if [ ! -f "$g" ]; then g="android/app/build.gradle"; fi
          if ! grep -q "vivox-sdk-5.28.0.aar" "$g"; then
            if [[ "$g" == *.kts ]]; then
              printf '\n// Vivox Core SDK 5.28.0\ndependencies { implementation(files("libs/vivox-sdk-5.28.0.aar")) }\n' >> "$g"
            else
              printf '\n// Vivox Core SDK 5.28.0\ndependencies { implementation files("libs/vivox-sdk-5.28.0.aar") }\n' >> "$g"
            fi
          fi

      - name: Flutter dependencies
        working-directory: nimzo
        run: |
          flutter pub get --enforce-lockfile
      - name: Analyzer
        working-directory: nimzo
        run: flutter analyze --no-fatal-infos
      - name: Full Flutter regression suite
        working-directory: nimzo
        run: flutter test --reporter expanded

      - name: Set up backend test runtime
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Backend authorization and delivery regression tests
        run: node --test supabase/functions/*/tests/*.test.mjs

      - name: Build release-mode Android TEST APK
        working-directory: nimzo
        # Generated Flutter host uses development signing; no production key is loaded.
        run: flutter build apk --release --no-pub

      - name: Verify compiled native voice bridge, Rocket videos and package
        run: |
          set -euo pipefail
          apk=nimzo/build/app/outputs/flutter-apk/app-release.apk
          test -s "$apk"
          python3 tools/verify_test_apk.py "$apk"
          python3 tools/verify_fcm_apk.py "$apk"
          printf '%s\n' "$GITHUB_SHA" > nimzo/build/app/outputs/flutter-apk/source-sha.txt
          sha256sum "$apk" > nimzo/build/app/outputs/flutter-apk/app-release.apk.sha256
          python3 - <<'PY'
          from zipfile import ZipFile
          p='nimzo/build/app/outputs/flutter-apk/app-release.apk'
          with ZipFile(p) as z:
              names=z.namelist()
              assert z.testzip() is None, 'Corrupt APK ZIP'
              assert any('libvivox_bridge.so' in x for x in names), 'Missing Vivox bridge'
              assert any('libvivox-sdk.so' in x or 'libvivoxsdk.so' in x for x in names), 'Missing Vivox SDK'
              for i in range(1,7):
                  for kind in ('fly','reward'):
                      path=f'assets/room_rocket/vap_rocket_{kind}_{i}.mp4'
                      assert any(x.endswith(path) for x in names),f'Missing {path}'
          print('NIMZO 12 rocket VAP clips and Vivox native SDK verified')
          PY
          ls -lh "$apk"
      - name: Enable KVM for Android launch smoke test
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install and launch release APK on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: python3 tools/verify_android_launch.py nimzo/build/app/outputs/flutter-apk/app-release.apk

      - name: Upload installable test APK and verification evidence
        uses: actions/upload-artifact@v4
        with:
          name: nimzo-repair-test-apk-${{ github.sha }}
          path: |
            nimzo/build/app/outputs/flutter-apk/app-release.apk
            nimzo/build/app/outputs/flutter-apk/app-release.apk.sha256
            nimzo/build/app/outputs/flutter-apk/app-release.apk.signing.txt
            nimzo/build/app/outputs/flutter-apk/app-release.apk.fcm-verification.txt
            nimzo/build/app/outputs/flutter-apk/source-sha.txt
          if-no-files-found: error
          retention-days: 14

      - name: Upload Android launch diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nimzo-repair-launch-diagnostics-${{ github.sha }}
          path: android-launch-diagnostics/
          if-no-files-found: warn
          retention-days: 14

  publish-verified:
    if: ${{ inputs.publish_verified_run != '' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      VERIFIED_RUN: ${{ inputs.publish_verified_run }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate completed source run
        run: |
          set -euo pipefail
          [[ "$VERIFIED_RUN" =~ ^[0-9]+$ ]]
          gh api "repos/$GH_REPO/actions/runs/$VERIFIED_RUN" > /tmp/verified-run.json
          python3 - <<'PYCODE'
          import json
          from pathlib import Path
          run = json.loads(Path('/tmp/verified-run.json').read_text())
          assert run['conclusion'] == 'success', 'Source APK workflow must have passed'
          assert run['path'] == '.github/workflows/android-apk.yml', 'Unexpected source workflow'
          assert run['event'] == 'workflow_dispatch', 'Unexpected source event'
          Path('/tmp/verified-source.txt').write_text(run['head_sha'])
          PYCODE
      - name: Download verified APK
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.publish_verified_run }}
          pattern: nimzo-repair-test-apk-*
          merge-multiple: true
          path: verified-apk
      - name: Publish original tested bytes
        run: |
          set -euo pipefail
          cd verified-apk
          test "$(cat source-sha.txt)" = "$(cat /tmp/verified-source.txt)"
          python3 - <<'PYCODE'
          import hashlib
          from pathlib import Path
          expected = Path('app-release.apk.sha256').read_text().split()[0]
          with Path('app-release.apk').open('rb') as apk:
              actual = hashlib.file_digest(apk, 'sha256').hexdigest()
          assert actual == expected, 'Downloaded APK checksum mismatch'
          PYCODE
          cp app-release.apk NIMZO_Test.apk
          zip -9 NIMZO_Test.zip NIMZO_Test.apk
          unzip -t NIMZO_Test.zip
          sha256sum NIMZO_Test.apk NIMZO_Test.zip > SHA256SUMS.txt
          tag="nimzo-repair-test-$VERIFIED_RUN"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" NIMZO_Test.apk NIMZO_Test.zip SHA256SUMS.txt source-sha.txt app-release.apk.signing.txt app-release.apk.fcm-verification.txt --clobber
          else
            gh release create "$tag" NIMZO_Test.apk NIMZO_Test.zip SHA256SUMS.txt source-sha.txt app-release.apk.signing.txt app-release.apk.fcm-verification.txt --target "$(cat source-sha.txt)" --prerelease --title "NIMZO Moments and Room Repairs Android Test APK" --notes-file ../docs/superpowers/verified-apk-release-notes.md
          fi
