name: Nimzo Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android platform
        working-directory: nimzo
        run: flutter create --platforms=android --project-name nimzo .

      - name: Configure Firebase Cloud Messaging (Android)
        env:
          NIMZO_GOOGLE_SERVICES_JSON: ${{ secrets.NIMZO_GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$NIMZO_GOOGLE_SERVICES_JSON" ]; then
            python3 nimzo/tool/configure_fcm_android.py --root nimzo
          else
            echo '::warning::NIMZO_GOOGLE_SERVICES_JSON is not set. Android APK will be built WITHOUT push notifications.'
          fi

      - name: Remove generated sample test
        working-directory: nimzo
        run: rm -f test/widget_test.dart

      - name: Flutter pub get
        working-directory: nimzo
        run: flutter pub get

      - name: Flutter analyze
        working-directory: nimzo
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Build release APK
        working-directory: nimzo
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: nimzo-release-apk
          path: nimzo/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
