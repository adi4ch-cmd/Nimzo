name: NIMZO 1.0.36 Manual Device Test Delivery
on:
  push:
    branches: [tools/nimzo-tana-vani-audit-20261020]
    paths: ['.github/workflows/nimzo-deliver-136-manual-test.yml']
  workflow_dispatch: {}
permissions:
  contents: write
  actions: read
jobs:
  deliver:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: d12478f2f2d42c6ab71a415fbe3cab18f972ebfa
      - name: Download existing compiled 1.0.36 APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/nimzo-release-136
          gh run download 39363234065             -n NIMZO-1.0.36-store-startup-smoke-12             -D /tmp/nimzo-release-136
          test -s /tmp/nimzo-release-136/app-release.apk
      - name: Independently verify APK original 26 media bytes, package and digest
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, pathlib, zipfile
          d=pathlib.Path('/tmp/nimzo-release-136')
          apk=d/'app-release.apk'
          digest=hashlib.sha256(apk.read_bytes()).hexdigest()
          checksum=(d/'app-release.apk.sha256').read_text().split()[0]
          assert checksum==digest,'APK checksum mismatch'
          manifest=json.loads(pathlib.Path('nimzo/assets/licensed_tana_vani/SOURCE_INVENTORY.json').read_text())
          assert len(manifest)==26
          with zipfile.ZipFile(apk) as z:
              assert z.testzip() is None,'APK ZIP CRC failed'
              names=set(z.namelist())
              assert 'AndroidManifest.xml' in names, 'Missing Android manifest'
              assert any(n.endswith('libvivox_bridge.so') for n in names),'Missing native Vivox bridge'
              for entry in manifest:
                  name='assets/flutter_assets/'+entry['asset_path']
                  assert name in names, f'Missing asset: {name}'
                  data=z.read(name)
                  assert len(data)==entry['bytes'] and hashlib.sha256(data).hexdigest()==entry['sha256'], f'Asset mismatch: {name}'
          assert len(apk.read_bytes())>100_000_000
          print('PASS: APK SHA256, 26 source media, Vivox bridge and APK structure')
          (d/'SOURCE_SHA.txt').write_text('d12478f2f2d42c6ab71a415fbe3cab18f972ebfa\n')
          (d/'SHA256SUMS.txt').write_text(f'{digest}  NIMZO_1.0.36_MANUAL_TEST.apk\n')
          PY
          mv /tmp/nimzo-release-136/app-release.apk /tmp/nimzo-release-136/NIMZO_1.0.36_MANUAL_TEST.apk
      - name: Publish clearly labeled manual-device startup test prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag=nimzo-1.0.36-manual-startup-test-39363234065
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Already published: $tag"
            exit 0
          fi
          cat >/tmp/nimzo-release-136/notes.md <<'NOTES'
          NIMZO 1.0.36+136 MANUAL DEVICE STARTUP TEST.
          NOT PRODUCTION, NOT A VERIFIED FIX FOR THE REPORTED BOOT ISSUE.
          Actual Flutter APK compiled and SHA256 checked. All 26 original
          Tana/Vani bundled source media independently verified by hashes.
          Contains source 1.0.36 startup retry improvements and Vivox/Rocket.
          No misleading claim that every Store item is equipable or that
          24 DangLive cosmetics are integrated. The prior emulator startup
          tests were unfinished at publication time. Full golden tests still
          have legacy visual failures. An install/update may fail due to an
          old app signed with a different development certificate. Before
          uninstalling, back up local-only content; server-side Supabase
          data is not erased by uninstall.
          NOTES
          gh release create "$tag"             /tmp/nimzo-release-136/NIMZO_1.0.36_MANUAL_TEST.apk             /tmp/nimzo-release-136/SHA256SUMS.txt             /tmp/nimzo-release-136/SOURCE_SHA.txt             --repo "$GITHUB_REPOSITORY"             --target d12478f2f2d42c6ab71a415fbe3cab18f972ebfa             --title 'NIMZO 1.0.36 — Manual Startup Device Test (Unverified)'             --notes-file /tmp/nimzo-release-136/notes.md             --prerelease --latest=false
