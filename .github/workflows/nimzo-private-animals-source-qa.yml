name: NIMZO Private Animal Gifts QA (NO APK)
on:
  push:
    branches: [feature/phoenix-tiger-gifts-1m-20261018]
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --test supabase/functions/gift-media/tests/access.test.mjs
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.6'
          channel: stable
          cache: true
      - run: flutter pub get
        working-directory: nimzo
      - run: flutter analyze --no-fatal-infos
        working-directory: nimzo
      - run: flutter test test/private_animal_gifts_test.dart test/car_only_gift_contract_test.dart test/verified_gift_broadcast_test.dart test/gift_retry_test.dart test/gift_rejection_test.dart test/gift_celebration_overlay_test.dart test/yo2_gift_ui_test.dart
        working-directory: nimzo
