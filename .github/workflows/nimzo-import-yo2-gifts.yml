name: Import original Yo2 gift media (not Dragon)

on:
  push:
    branches:
      - feature/profile-reference-redesign
    paths:
      - NIMZO_Yo2_Assets_Part_1_of_2.zip
      - NIMZO_Yo2_Assets_Part_2_of_2.zip

permissions:
  contents: write

jobs:
  install-gift-assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Check both supplied original archives
        id: originals
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -f NIMZO_Yo2_Assets_Part_1_of_2.zip || ! -f NIMZO_Yo2_Assets_Part_2_of_2.zip ]]; then
            echo "Only one part uploaded. Waiting for the other part."
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "bc3449b2dc0db1db1b7228a36cc64036b0c206e0ebaad4c749bec8ccf229b40e  NIMZO_Yo2_Assets_Part_1_of_2.zip" | sha256sum -c -
          echo "7837f52fac8cc0c28ca8cfb263e618c7e013f9656ad4a3536beeee75e15e9249  NIMZO_Yo2_Assets_Part_2_of_2.zip" | sha256sum -c -
          echo "ready=true" >> "$GITHUB_OUTPUT"
      - name: Extract and register only gift assets
        if: steps.originals.outputs.ready == 'true'
        run: |
          python3 tools/import_yo2_gift_assets.py NIMZO_Yo2_Assets_Part_1_of_2.zip NIMZO_Yo2_Assets_Part_2_of_2.zip
      - name: Commit original gift assets (no Dragon)
        if: steps.originals.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add nimzo/assets/yo2_gifts/ nimzo/pubspec.yaml
          git rm -f -- NIMZO_Yo2_Assets_Part_1_of_2.zip NIMZO_Yo2_Assets_Part_2_of_2.zip
          if git diff --cached --quiet; then
            echo "No new gift assets to commit"
            exit 0
          fi
          git commit -m "gifts: install approved Yo2 gift UI and effects [gifts-only]"
          git push
