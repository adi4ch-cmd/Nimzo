name: Nimzo APK Build
on:
  push:
    branches: ["main"]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: nimzo
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.29.3"
          channel: stable
          cache: true
      - run: flutter create --platforms=android --org io.nimzo .
      - name: Configure Nimzo OAuth deep link
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path("android/app/src/main/AndroidManifest.xml")
          s = p.read_text()
          pattern = r'<activity\b[^>]*android:name="[^"]*MainActivity[^"]*"[^>]*>.*?</activity>'
          m = re.search(pattern, s, re.DOTALL)
          if not m:
              raise SystemExit("MainActivity block not found")
          block = m.group(0)
          block = re.sub(r'\sandroid:exported="[^"]*"', '', block)
          block = re.sub(r'\sandroid:launchMode="[^"]*"', '', block)
          block = re.sub(r'<activity\b', '<activity android:exported="true" android:launchMode="singleTask"', block, count=1)
          block = re.sub(r'\s*<meta-data\s+android:name="flutter_deeplinking_enabled"\s+android:value="[^"]*"\s*/>\s*', '\n', block)
          deep = '''\n            <meta-data android:name="flutter_deeplinking_enabled" android:value="false" />\n            <intent-filter>\n                <action android:name="android.intent.action.VIEW" />\n                <category android:name="android.intent.category.DEFAULT" />\n                <category android:name="android.intent.category.BROWSABLE" />\n                <data android:scheme="io.nimzo.app" android:host="login-callback" />\n            </intent-filter>'''
          block = block.replace('</activity>', deep + '\n        </activity>')
          s = s[:m.start()] + block + s[m.end():]
          p.write_text(s)
          PY
      - run: flutter pub get
      - run: flutter analyze lib --no-fatal-infos --no-fatal-warnings
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: nimzo-pro-polish-release
          path: nimzo/build/app/outputs/flutter-apk/app-release.apk
