name: NIMZO VIP SVIP All-Tier Pack QA (No APK)
on:
  push:
    branches:
      - feature/vip-svip-every-tier-packs-20261023
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  membership-pack-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.6'
          channel: stable
          cache: true
      - name: Restore locked Flutter dependencies
        working-directory: nimzo
        run: flutter pub get --enforce-lockfile
      - name: Verify Flutter sources
        working-directory: nimzo
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - name: Verify all tiers and membership rendering
        working-directory: nimzo
        run: |
          flutter test --reporter expanded \
            test/membership_catalog_test.dart \
            test/membership_pack_inventory_test.dart \
            test/membership_pack_runtime_test.dart \
            test/membership_identity_test.dart \
            test/membership_status_test.dart \
            test/membership_purchase_keys_test.dart
