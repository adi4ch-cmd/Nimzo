name: NIMZO 1.0.36 No-Vivox Startup Test

on:
  push:
    branches:
      - fix/startup-no-vivox-sdk-20261020
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  android-test:
    runs-on: ubuntu-latest
    timeout-minutes: 85
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify NIMZO FEATURES lock before building
        run: python3 tools/verify_nimzo_feature_lock.py

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Flutter stable
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.6"
          channel: stable
          cache: true

      - name: Generate Android project
        working-directory: nimzo
        run: flutter create --platforms=android --project-name nimzo .

      - name: Configure API 36 compatible Android toolchain
        working-directory: nimzo
        run: python3 ../tools/configure_android_gradle.py android

      - name: Prepare minimal Android activity without Vivox SDK
        working-directory: nimzo
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p android/app/src/main/java/io/nimzo/app android/app/src/main/res/drawable
          cp native/vivox/android/nimzo_launcher.xml android/app/src/main/res/drawable/nimzo_launcher.xml
          cp assets/brand/nimzo_purple_gold.png android/app/src/main/res/drawable/nimzo_brand_icon.png
          cp native/vivox/android/NimzoUpdate.java android/app/src/main/java/io/nimzo/app/NimzoUpdate.java
          cp native/voice_disabled/android/MainActivity.java android/app/src/main/java/io/nimzo/app/MainActivity.java

      - name: Configure Android ID permissions and OAuth callback
        working-directory: nimzo
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          gradle = Path("android/app/build.gradle.kts")
          if not gradle.exists():
              gradle = Path("android/app/build.gradle")
          s = gradle.read_text()

          if gradle.suffix == ".kts":
              s = re.sub(r'namespace\s*=\s*"[^"]+"', 'namespace = "io.nimzo.app"', s, count=1)
              s = re.sub(r'applicationId\s*=\s*"[^"]+"', 'applicationId = "io.nimzo.app"', s, count=1)
          gradle.write_text(s)

          manifest = Path("android/app/src/main/AndroidManifest.xml")
          m = manifest.read_text()
          m = re.sub(r'android:label="[^"]+"', 'android:label="Nimzo"', m, count=1)
          m = re.sub(r'android:icon="[^"]+"', 'android:icon="@drawable/nimzo_launcher"', m, count=1)
          if "xmlns:tools=" not in m:
              m = m.replace("<manifest", '<manifest xmlns:tools="http://schemas.android.com/tools"', 1)

          for perm in [
              "android.permission.REQUEST_INSTALL_PACKAGES",
              "android.permission.INTERNET",
              "android.permission.RECORD_AUDIO",
              "android.permission.MODIFY_AUDIO_SETTINGS",
              "android.permission.BLUETOOTH",
              "android.permission.BLUETOOTH_CONNECT",
              "android.permission.BLUETOOTH_SCAN",
          ]:
              tag = f'<uses-permission android:name="{perm}" />'
              if perm not in m:
                  m = m.replace("<application", tag + "\n    <application", 1)

          m = re.sub(
              r'<meta-data\s+android:name="flutter_deeplinking_enabled"\s+android:value="(?:true|false)"\s*/>',
              '<meta-data android:name="flutter_deeplinking_enabled" android:value="false" />',
              m,
          )

          activity = re.search(
              r'<activity\b[^>]*android:name="[^"]*MainActivity[^"]*"[^>]*>(.*?)</activity>',
              m,
              re.DOTALL,
          )
          if not activity:
              raise SystemExit("MainActivity block not found")

          block = activity.group(0)
          opening = re.match(r'<activity\b[^>]*>', block).group(0)
          opening = re.sub(r'\sandroid:exported="[^"]*"', '', opening)
          opening = re.sub(r'\sandroid:launchMode="[^"]*"', '', opening)
          opening = opening[:-1] + ' android:exported="true" android:launchMode="singleTask">'
          body = block[len(re.match(r'<activity\b[^>]*>', block).group(0)):]
          if 'android:scheme="io.nimzo.app"' not in body:
              body = body.replace("</activity>", '''<intent-filter>
              <action android:name="android.intent.action.VIEW" />
              <category android:name="android.intent.category.DEFAULT" />
              <category android:name="android.intent.category.BROWSABLE" />
              <data android:scheme="io.nimzo.app" android:host="login-callback" />
          </intent-filter>
          </activity>''')
          if 'android:name="flutter_deeplinking_enabled"' not in body:
              body = body.replace("</activity>", '<meta-data android:name="flutter_deeplinking_enabled" android:value="false" />\n</activity>')
          m = m[:activity.start()] + opening + body + m[activity.end():]

          if 'tools:replace="android:name"' not in m:
              m = m.replace("<application", '<application tools:replace="android:name"', 1)

          if 'android:name="flutter_deeplinking_enabled"' not in m:
              m = m.replace(
                  "<application",
                  '<application',
                  1,
              )
              app_end = m.find(">", m.find("<application"))
              m = m[:app_end+1] + '\n        <meta-data android:name="flutter_deeplinking_enabled" android:value="false" />' + m[app_end+1:]

          provider = '''<provider android:name="androidx.core.content.FileProvider" android:authorities="io.nimzo.app.apk_updates" android:exported="false" android:grantUriPermissions="true"><meta-data android:name="android.support.FILE_PROVIDER_PATHS" android:resource="@xml/nimzo_apk_paths" /></provider>'''
          m = m.replace("</application>", provider + "\n</application>")
          paths = Path("android/app/src/main/res/xml/nimzo_apk_paths.xml")
          paths.parent.mkdir(parents=True, exist_ok=True)
          paths.write_text('<paths xmlns:android="http://schemas.android.com/apk/res/android"><cache-path name="nimzo_updates" path="nimzo_updates/" /></paths>')
          manifest.write_text(m)

          # Fail fast: verify the exact OAuth contract that Supabase expects.
          final = manifest.read_text()
          assert 'application tools:replace="android:name"' in final
          assert 'android:scheme="io.nimzo.app" android:host="login-callback"' in final
          assert 'android:exported="true"' in final
          assert 'android:launchMode="singleTask"' in final
          activity_final = re.search(r'<activity\b[^>]*>.*?</activity>', final, re.DOTALL).group(0)
          assert 'android:name="flutter_deeplinking_enabled" android:value="false"' in activity_final
          print("OAuth manifest verification: PASS")
          PY

      - name: Preserve original Vivox SDK integration files untouched
        run: |
          test -s nimzo/native/vivox/android/MainActivity.java
          test -s nimzo/native/vivox/android/NimzoVivox.java
          test -s nimzo/native/vivox/android/vivox_bridge.cpp
          test -s nimzo/native/vivox/android/CMakeLists.txt
          echo "Vivox source retained, SDK deferred for this test APK"

      - name: Enable core library desugaring for Android notifications
        working-directory: nimzo
        shell: bash
        run: |
          set -euo pipefail
          cat >> android/app/build.gradle.kts <<'GRADLE'
          // flutter_local_notifications requires Java 8+ API desugaring.
          android {
              compileOptions {
                  isCoreLibraryDesugaringEnabled = true
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
          }
          dependencies {
              coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.5")
          }
          GRADLE
      - name: Flutter dependencies
        working-directory: nimzo
        run: |
          rm -f test/widget_test.dart
          flutter pub get
      - name: Analyzer
        working-directory: nimzo
        run: flutter analyze --no-fatal-infos
      - name: Store, Backpack and preservation regression tests
        working-directory: nimzo
        run: flutter test --reporter expanded test/store_live_contract_test.dart test/startup_bootstrap_contract_test.dart test/store_full_preview_test.dart test/pending_gifts_preview_contract_test.dart test/coming_soon_navigation_test.dart test/membership_retirement_test.dart test/licensed_media_gallery_test.dart

      - name: Verify gift rendering, staged cards and Rocket VAP packaging
        working-directory: nimzo
        run: |
          flutter test --reporter expanded test/rocket_unified_gifts_contract_test.dart
          flutter test --reporter expanded test/unified_fullscreen_gifts_test.dart
          flutter test --reporter expanded test/fullscreen_vap_gifts_contract_test.dart
      - name: Validate Codex Home and Events reference screens
        working-directory: nimzo
        run: |
          flutter test --reporter expanded test/home_events_reference_test.dart test/events_routes_test.dart test/home_reference_test.dart test/home_refresh_test.dart test/home_narrow_layout_test.dart test/home_country_filter_test.dart test/home_country_sheet_test.dart test/issue15_navigation_test.dart
      - name: Verify private gateway access
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --test supabase/functions/gift-media/tests/access.test.mjs
      - name: Gift settlement, room playback, retirement and rocket regression tests
        working-directory: nimzo
        run: flutter test --reporter expanded test/private_animal_gifts_test.dart test/private_gift_readiness_test.dart test/car_only_gift_contract_test.dart test/verified_gift_broadcast_test.dart test/gift_retry_test.dart test/gift_rejection_test.dart test/gift_celebration_overlay_test.dart test/yo2_gift_ui_test.dart test/room_rocket_test.dart test/room_rocket_leaderboard_test.dart test/feature_retirement_contract_test.dart test/membership_retirement_test.dart
      - name: Test missed-Realtime Rocket and gift recovery
        working-directory: nimzo
        run: flutter test --reporter expanded test/rocket_gift_realtime_recovery_test.dart
      - name: Verify no-charge premium VAP diagnostics
        working-directory: nimzo
        run: flutter test --reporter expanded test/gift_qa_diagnostics_test.dart
      - name: Build unified release-mode test APK
        working-directory: nimzo
        run: flutter build apk --release
      - name: Verify SDK-free APK, Rocket and original assets
        run: |
          set -euo pipefail
          apk=nimzo/build/app/outputs/flutter-apk/app-release.apk
          test -s "$apk"
          sha256sum "$apk" > nimzo/build/app/outputs/flutter-apk/app-release.apk.sha256
          python3 - <<'PY'
          from zipfile import ZipFile
          p='nimzo/build/app/outputs/flutter-apk/app-release.apk'
          with ZipFile(p) as z:
              names=z.namelist()
              assert z.testzip() is None, 'Corrupt APK ZIP'
              assert not any('libvivox_bridge.so' in x for x in names), 'Unexpected native Vivox bridge'
              assert not any('libvivox-sdk.so' in x or 'libvivoxsdk.so' in x for x in names), 'Unexpected Vivox SDK'
              for i in range(1,7):
                  for kind in ('fly','reward'):
                      path=f'assets/room_rocket/vap_rocket_{kind}_{i}.mp4'
                      assert any(x.endswith(path) for x in names),f'Missing {path}'
          for asset in ('assets/events/reference_banners.jpg',
                        'assets/gifts/staged/tiger_warrior.svg',
                        'assets/gifts/staged/romantic_blossom.svg',
                        'assets/gifts/staged/ice_queen_magic.svg'):
              assert any(n.endswith(asset) for n in names), f'Missing APK Flutter asset: {asset}'
          import hashlib, json
          from pathlib import Path
          manifest=json.loads(Path('nimzo/assets/licensed_tana_vani/SOURCE_INVENTORY.json').read_text())
          assert len(manifest)==26, 'Original source media inventory incomplete'
          with ZipFile(p) as package:
              for asset in manifest:
                  logical=asset['asset_path']
                  expected='assets/flutter_assets/' + logical
                  possible=[x for x in package.namelist() if x == expected]
                  if len(possible)!=1:
                      similar=[x for x in package.namelist() if 'licensed_tana_vani/' in x][:12]
                      print('SAMPLED_COMPILED_LICENSED_ASSET_PATHS', similar)
                  assert len(possible)==1, f"Media missing or duplicated: {expected}"
                  assert len(possible)==1, f"Media missing or duplicated: {asset['asset_path']}"
                  original=package.read(possible[0])
                  assert len(original)==asset['bytes'], f"Media size mismatch: {asset['asset_path']}"
                  assert hashlib.sha256(original).hexdigest()==asset['sha256'], f"Media hash mismatch: {asset['asset_path']}"
          print('NIMZO 12 Rocket VAP, Vivox, events and 26 original Tana/Vani assets verified in APK')
          PY
          ls -lh "$apk"
      - name: Upload installable test APK and checksum
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: NIMZO-1.0.36-no-vivox-smoke-${{ github.run_number }}
          path: |
            nimzo/build/app/outputs/flutter-apk/app-release.apk
            nimzo/build/app/outputs/flutter-apk/app-release.apk.sha256
          if-no-files-found: error
          retention-days: 14

      - name: Publish labeled SDK-deferred manual test APK
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          out=nimzo/build/app/outputs/flutter-apk
          test -s "$out/app-release.apk"
          mkdir -p /tmp/no-vivox-apk
          cp "$out/app-release.apk" /tmp/no-vivox-apk/NIMZO_1.0.36_NO_VIVOX_TEST.apk
          (cd /tmp/no-vivox-apk && sha256sum NIMZO_1.0.36_NO_VIVOX_TEST.apk > SHA256SUMS.txt)
          printf '%s\n' "$GITHUB_SHA" > /tmp/no-vivox-apk/SOURCE_SHA.txt
          tag="nimzo-1.0.36-no-vivox-test-${GITHUB_RUN_ID}"
          cat > /tmp/no-vivox-apk/notes.md <<'RELEASENOTES'
          NIMZO 1.0.36+136 — No-Vivox startup diagnostic test APK.
          The user explicitly requested Vivox be deferred. All original Vivox
          implementation files remain unchanged in GitHub for a later build.
          In this temporary Android APK the live voice SDK is not linked:
          microphone join / Vivox voice-room features are unavailable.
          Store, gifts, games, Android payments, app updates and OAuth code
          are preserved. No Supabase user accounts or wallets were changed.
          Original 26 Tana/Vani media SHA256 checks pass in the compiled APK.
          This is a test binary, not production or a proven startup fix.
          Android emulator and real phone login remain unverified until tested.
          If a previous APK uses a different signing certificate, updating it
          in place may fail. Uninstalling can delete device-local settings/data.
          RELEASENOTES
          gh release create "$tag" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "NIMZO 1.0.36 — No Vivox SDK Test APK" \
            --notes-file /tmp/no-vivox-apk/notes.md \
            --prerelease --latest=false \
            /tmp/no-vivox-apk/NIMZO_1.0.36_NO_VIVOX_TEST.apk \
            /tmp/no-vivox-apk/SHA256SUMS.txt \
            /tmp/no-vivox-apk/SOURCE_SHA.txt
      - name: Verify Android 35 app startup on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_6
          ram-size: 2048M
          heap-size: 256M
          emulator-boot-timeout: 900
          disable-animations: true
          script: |
            set -eu
            apk=nimzo/build/app/outputs/flutter-apk/app-release.apk
            adb install -r "$apk"
            adb logcat -c
            adb shell am start -W -n io.nimzo.app/io.nimzo.app.MainActivity
            # Startup initializes Supabase for up to 12 seconds; do not
            # mistake a fast process start for a rendered Flutter screen.
            sleep 23
            pid="$(adb shell pidof io.nimzo.app | tr -d '\\r')"
            test -n "$pid" || { adb logcat -d -v brief | tail -200; exit 1; }
            mkdir -p nimzo/build/startup-evidence
            adb exec-out screencap -p > nimzo/build/startup-evidence/launch.png
            adb logcat -d -v time > nimzo/build/startup-evidence/logcat.txt
            python3 -m pip install --quiet pillow
            python3 - <<'PY'
            from PIL import Image, ImageStat
            p='nimzo/build/startup-evidence/launch.png'
            img=Image.open(p).convert('RGB')
            st=ImageStat.Stat(img)
            assert img.width>=320 and img.height>=640, 'Invalid screenshot'
            # Not a proof of login, but fails if the emulator only shows
            # a uniform black native splash after the startup timeout.
            assert max(st.stddev)>12, 'Blank/uniform startup screen'
            print('Android startup nonblank frame: PASS', img.size, st.stddev)
            PY
            # A responsive error screen is NOT a passed login/startup test.
            if grep -Fq 'NIMZO startup failed:' nimzo/build/startup-evidence/logcat.txt; then
              echo 'Flutter initialization failed despite drawing a frame'
              exit 1
            fi
            adb shell uiautomator dump /sdcard/nimzo_window.xml >/dev/null 2>&1 || true
            adb shell cat /sdcard/nimzo_window.xml > nimzo/build/startup-evidence/window.xml 2>/dev/null || true
            if grep -Eiq 'could not start|initialization error|tap retry' nimzo/build/startup-evidence/window.xml; then
              echo 'App is stuck on startup Retry/error screen'
              exit 1
            fi
            if grep -E 'FATAL EXCEPTION:|Fatal signal [0-9]+' nimzo/build/startup-evidence/logcat.txt | grep -E -i -q 'nimzo|flutter|vivox'; then
              echo 'Potential Android crash found in launch log'; exit 1
            fi
      - name: Upload Android launch evidence even on failure
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nimzo-1.0.36-no-vivox-startup-evidence-${{ github.run_number }}
          path: nimzo/build/startup-evidence/
          if-no-files-found: warn
