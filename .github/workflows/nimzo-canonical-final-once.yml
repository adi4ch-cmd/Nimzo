name: NIMZO final canonical format reconciliation
on:
  push:
    branches: [feature/profile-reference-redesign]
    paths:
      - .github/workflows/nimzo-canonical-final-once.yml
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: true}
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.6'
          channel: stable
      - name: Resolve Dart language version
        working-directory: nimzo
        run: flutter pub get
      - name: Apply formatter once without changing runtime behavior
        shell: bash
        run: |
          set -euo pipefail
          cd nimzo
          dart format lib test
          cd ..
          if ! git diff --quiet -- nimzo/lib nimzo/test; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add nimzo/lib nimzo/test
            git commit -m "style: reconcile Hilo code with Flutter 3.47.6 canonical formatting"
            git pull --rebase origin feature/profile-reference-redesign
            git push origin HEAD:feature/profile-reference-redesign
          fi
