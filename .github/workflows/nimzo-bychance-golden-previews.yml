name: NIMZO Updated Screen Previews

on:
  pull_request:
    branches:
      - feature/profile-reference-redesign

permissions:
  contents: read

jobs:
  generate-preview-artifact:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'feature/bychance-inspired-ui-20261016' }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: true
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.6"
          channel: stable
          cache: true
      - name: Resolve Flutter dependencies
        working-directory: nimzo
        run: flutter pub get
      - name: Render screen previews without modifying baselines
        working-directory: nimzo
        run: >
          flutter test --update-goldens
          test/reference_preview_test.dart
          test/master_visual_preview_test.dart
          test/remaining_visual_qa_test.dart
      - name: Save visual comparisons for review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nimzo-bychance-screen-previews
          path: nimzo/test/goldens/
          if-no-files-found: error
