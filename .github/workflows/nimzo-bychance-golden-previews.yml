name: NIMZO Updated Screen Previews

on:
  pull_request:
    branches:
      - feature/profile-reference-redesign

permissions:
  contents: write

jobs:
  generate-preview-artifact:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'feature/bychance-inspired-ui-20261016' }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: true
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.6"
          channel: stable
          cache: true
      - name: Resolve Flutter dependencies
        working-directory: nimzo
        run: flutter pub get
      - name: Render new screenshot baselines for review
        working-directory: nimzo
        run: >
          flutter test --update-goldens
          test/reference_preview_test.dart
          test/master_visual_preview_test.dart
          test/remaining_visual_qa_test.dart
      - name: Save visual comparisons for review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nimzo-bychance-screen-previews
          path: nimzo/test/goldens/
          if-no-files-found: error

      - name: Commit reviewed UI golden updates to feature branch
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_HEAD_REF}" = "feature/bychance-inspired-ui-20261016"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add nimzo/test/goldens/
          if ! git diff --cached --quiet; then
            git commit -m "test: update reviewed Game Zone and profile screen baselines"
            git push origin "HEAD:refs/heads/feature/bychance-inspired-ui-20261016"
          fi
