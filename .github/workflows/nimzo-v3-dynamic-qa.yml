name: NIMZO v3 Dynamic TEST APK - Vivox Deferred
on:
  workflow_dispatch: {}
  push:
    branches: [integration/nimzo-v3-dynamic-20261021]
    paths: [release/acceptance.json, .github/workflows/nimzo-v3-dynamic-qa.yml]

permissions:
  contents: write

jobs:
  android-test:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[dynamic-qa]')
    runs-on: ubuntu-latest
    timeout-minutes: 85
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enforce owner-authorized dynamic QA acceptance
        run: python3 tools/verify_prebuild_acceptance.py --dynamic-qa

      - name: Verify NIMZO FEATURES lock before building
        run: python3 tools/verify_nimzo_feature_lock.py

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Verify native auth key policy against SDK PKCE key
        run: python3 tools/test_native_auth_storage_key_policy.py

      - name: Flutter stable
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.6"
          channel: stable
          cache: true

      - name: Generate Android project
        working-directory: nimzo
        run: |
          flutter create . --no-pub --platforms=android --project-name nimzo
          git restore --source=HEAD -- pubspec.lock

      - name: Configure API 36 compatible Android toolchain
        working-directory: nimzo
        run: python3 ../tools/configure_android_gradle.py android

      - name: Prepare minimal Android activity without Vivox SDK
        working-directory: nimzo
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p android/app/src/main/java/io/nimzo/app android/app/src/main/res/drawable
          cp native/vivox/android/nimzo_launcher.xml android/app/src/main/res/drawable/nimzo_launcher.xml
          cp assets/brand/nimzo_purple_gold.png android/app/src/main/res/drawable/nimzo_brand_icon.png
          cp native/vivox/android/NimzoUpdate.java android/app/src/main/java/io/nimzo/app/NimzoUpdate.java
          cp native/voice_disabled/android/MainActivity.java android/app/src/main/java/io/nimzo/app/MainActivity.java

      - name: Configure Android ID permissions and OAuth callback
        working-directory: nimzo
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          gradle = Path("android/app/build.gradle.kts")
          if not gradle.exists():
              gradle = Path("android/app/build.gradle")
          s = gradle.read_text()

          if gradle.suffix == ".kts":
              s = re.sub(r'namespace\s*=\s*"[^"]+"', 'namespace = "io.nimzo.app"', s, count=1)
              s = re.sub(r'applicationId\s*=\s*"[^"]+"', 'applicationId = "io.nimzo.app"', s, count=1)
          gradle.write_text(s)

          manifest = Path("android/app/src/main/AndroidManifest.xml")
          m = manifest.read_text()
          m = re.sub(r'android:label="[^"]+"', 'android:label="Nimzo"', m, count=1)
          m = re.sub(r'android:icon="[^"]+"', 'android:icon="@drawable/nimzo_launcher"', m, count=1)
          if "xmlns:tools=" not in m:
              m = m.replace("<manifest", '<manifest xmlns:tools="http://schemas.android.com/tools"', 1)

          for perm in [
              "android.permission.REQUEST_INSTALL_PACKAGES",
              "android.permission.INTERNET",
              "android.permission.RECORD_AUDIO",
              "android.permission.MODIFY_AUDIO_SETTINGS",
              "android.permission.BLUETOOTH",
              "android.permission.BLUETOOTH_CONNECT",
              "android.permission.BLUETOOTH_SCAN",
          ]:
              tag = f'<uses-permission android:name="{perm}" />'
              if perm not in m:
                  m = m.replace("<application", tag + "\n    <application", 1)

          m = re.sub(
              r'<meta-data\s+android:name="flutter_deeplinking_enabled"\s+android:value="(?:true|false)"\s*/>',
              '<meta-data android:name="flutter_deeplinking_enabled" android:value="false" />',
              m,
          )

          activity = re.search(
              r'<activity\b[^>]*android:name="[^"]*MainActivity[^"]*"[^>]*>(.*?)</activity>',
              m,
              re.DOTALL,
          )
          if not activity:
              raise SystemExit("MainActivity block not found")

          block = activity.group(0)
          opening = re.match(r'<activity\b[^>]*>', block).group(0)
          opening = re.sub(r'\sandroid:exported="[^"]*"', '', opening)
          opening = re.sub(r'\sandroid:launchMode="[^"]*"', '', opening)
          opening = opening[:-1] + ' android:exported="true" android:launchMode="singleTask">'
          body = block[len(re.match(r'<activity\b[^>]*>', block).group(0)):]
          if 'android:scheme="io.nimzo.app"' not in body:
              body = body.replace("</activity>", '''<intent-filter>
              <action android:name="android.intent.action.VIEW" />
              <category android:name="android.intent.category.DEFAULT" />
              <category android:name="android.intent.category.BROWSABLE" />
              <data android:scheme="io.nimzo.app" android:host="login-callback" />
          </intent-filter>
          </activity>''')
          if 'android:name="flutter_deeplinking_enabled"' not in body:
              body = body.replace("</activity>", '<meta-data android:name="flutter_deeplinking_enabled" android:value="false" />\n</activity>')
          m = m[:activity.start()] + opening + body + m[activity.end():]

          if 'tools:replace="android:name"' not in m:
              m = m.replace("<application", '<application tools:replace="android:name"', 1)

          if 'android:name="flutter_deeplinking_enabled"' not in m:
              m = m.replace(
                  "<application",
                  '<application',
                  1,
              )
              app_end = m.find(">", m.find("<application"))
              m = m[:app_end+1] + '\n        <meta-data android:name="flutter_deeplinking_enabled" android:value="false" />' + m[app_end+1:]

          provider = '''<provider android:name="androidx.core.content.FileProvider" android:authorities="io.nimzo.app.apk_updates" android:exported="false" android:grantUriPermissions="true"><meta-data android:name="android.support.FILE_PROVIDER_PATHS" android:resource="@xml/nimzo_apk_paths" /></provider>'''
          m = m.replace("</application>", provider + "\n</application>")
          paths = Path("android/app/src/main/res/xml/nimzo_apk_paths.xml")
          paths.parent.mkdir(parents=True, exist_ok=True)
          paths.write_text('<paths xmlns:android="http://schemas.android.com/apk/res/android"><cache-path name="nimzo_updates" path="nimzo_updates/" /></paths>')
          manifest.write_text(m)

          # Fail fast: verify the exact OAuth contract that Supabase expects.
          final = manifest.read_text()
          assert 'application tools:replace="android:name"' in final
          assert 'android:scheme="io.nimzo.app" android:host="login-callback"' in final
          assert 'android:exported="true"' in final
          assert 'android:launchMode="singleTask"' in final
          activity_final = re.search(r'<activity\b[^>]*>.*?</activity>', final, re.DOTALL).group(0)
          assert 'android:name="flutter_deeplinking_enabled" android:value="false"' in activity_final
          print("OAuth manifest verification: PASS")
          PY

      - name: Preserve original Vivox SDK integration files untouched
        run: |
          test -s nimzo/native/vivox/android/MainActivity.java
          test -s nimzo/native/vivox/android/NimzoVivox.java
          test -s nimzo/native/vivox/android/vivox_bridge.cpp
          test -s nimzo/native/vivox/android/CMakeLists.txt
          echo "Vivox source retained, SDK deferred for this test APK"

      - name: Enable core library desugaring for Android notifications
        working-directory: nimzo
        shell: bash
        run: |
          set -euo pipefail
          cat >> android/app/build.gradle.kts <<'GRADLE'
          // flutter_local_notifications requires Java 8+ API desugaring.
          android {
              compileOptions {
                  isCoreLibraryDesugaringEnabled = true
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
          }
          dependencies {
              coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.5")
          }
          GRADLE
      - name: Protect native shared_preferences Kotlin coroutine ABI in release
        working-directory: nimzo
        run: |
          set -euo pipefail
          cp native/voice_disabled/android/sharedpreferences-r8-rules.pro android/app/sharedpreferences-r8-rules.pro
          cat >> android/app/build.gradle.kts <<'GRADLE'
          // R8 must preserve JNI-reflected Kotlin coroutine signatures.
          android {
              buildTypes {
                  getByName("release") {
                      proguardFiles("sharedpreferences-r8-rules.pro")
                      // Temporary TEST build: disable R8 until all Flutter
                      // JNI-reflected Kotlin classes survive release builds.
                      // Vivox stays deferred; user data/signing stays untouched.
                      isMinifyEnabled = false
                      isShrinkResources = false
                  }
              }
          }
          GRADLE

      - name: Flutter dependencies
        working-directory: nimzo
        run: |
          rm -f test/widget_test.dart
          flutter pub get --enforce-lockfile
      - name: Check original 441 premium assets and SVIP 1-8
        run: python3 tools/verify_willchill_premium.py

      - name: Analyze Flutter code
        working-directory: nimzo
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Test complete Flutter suite before building
        working-directory: nimzo
        run: flutter test --concurrency=4 --reporter expanded
      - name: Recheck exact accepted source after setup/tests
        run: python3 tools/verify_prebuild_acceptance.py --dynamic-qa
      - name: Build owner-authorized dynamic TEST APK (Vivox deferred)
        working-directory: nimzo
        run: flutter build apk --release

      - name: Verify exact membership pack originals in APK
        run: |
          python3 tools/verify_membership_pack_assets.py
          python3 - <<'PYCODE'
          import hashlib,json
          from pathlib import Path
          from zipfile import ZipFile
          index=json.loads(Path('nimzo/assets/membership/packs/provenance.json').read_text())
          with ZipFile('nimzo/build/app/outputs/flutter-apk/app-release.apk') as apk:
              count=0
              for slots in index.values():
                  for row in slots.values():
                      data=apk.read('assets/flutter_assets/'+row['path'])
                      assert hashlib.sha256(data).hexdigest()==row['sha256'],row['path']
                      count+=1
          print('PASS: exact original membership pack records packaged:',count)
          PYCODE
      - name: Verify exact v3 compiled media bytes
        run: python3 tools/verify_v3_apk_assets.py nimzo/build/app/outputs/flutter-apk/app-release.apk
      - name: Verify all imported gifts, Store and membership originals in compiled APK
        run: python3 tools/verify_drive_apk_assets.py nimzo/build/app/outputs/flutter-apk/app-release.apk
      - name: Verify compiled shared_preferences native startup ABI
        run: |
          python3 tools/test_shared_preferences_abi_policy.py
          python3 tools/verify_shared_preferences_android_abi.py nimzo/build/app/outputs/flutter-apk/app-release.apk

      - name: Verify every original WillChill asset in compiled APK
        run: |
          python3 tools/verify_willchill_apk_bundle.py nimzo/build/app/outputs/flutter-apk/app-release.apk
          python3 - <<'PY'
          from zipfile import ZipFile
          p='nimzo/build/app/outputs/flutter-apk/app-release.apk'
          with ZipFile(p) as z:
              assert z.testzip() is None, 'APK has invalid ZIP content'
              names=z.namelist()
              assert not any('libvivox_bridge.so' in n for n in names), 'Unexpected native Vivox bridge'
              assert not any('libvivox-sdk.so' in n or 'libvivoxsdk.so' in n for n in names), 'Unexpected Vivox SDK'
          print('SDK-free Android build, original premium assets: PASS')
          PY
          python3 - <<'PYCODE'
          from pathlib import Path
          from zipfile import ZipFile
          import re
          root=Path('nimzo')
          registry=(root/'lib/features/store/premium_cosmetics.dart').read_text()
          paths=set(re.findall(r"'(assets/premium_store/[^']+)'",registry))
          with ZipFile('nimzo/build/app/outputs/flutter-apk/app-release.apk') as z:
              for path in paths:
                  assert z.read('assets/flutter_assets/'+path)==(root/path).read_bytes(),path
          print('Verified pinned Store media in compiled APK:',len(paths))
          PYCODE
          ATOOL="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          "$ATOOL" verify --verbose nimzo/build/app/outputs/flutter-apk/app-release.apk
      - name: Enable KVM for Android launch smoke test
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install and launch release APK
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: python3 tools/verify_android_launch.py nimzo/build/app/outputs/flutter-apk/app-release.apk

      - name: Prepare installable APKs and checksums
        run: |
          mkdir -p premium-test-apk
          cp nimzo/build/app/outputs/flutter-apk/app-release.apk premium-test-apk/NIMZO_1.0.43_Universal_NO_VIVOX_TEST.apk
          printf '%s\n' "$GITHUB_SHA" > premium-test-apk/SOURCE_SHA.txt
          cp release/acceptance.json premium-test-apk/ACCEPTANCE.json
          cp android-launch-diagnostics/result.txt premium-test-apk/STARTUP_TEST.txt
          printf '%s\n' 'Owner-requested1.0.43 UI TEST APK. Includes latest Falla/Hafla source choices, one profile membership badge, actual applied/equipped collection previews, compact mic identity and premium room-user card. Vivox remains deferred: voice is unavailable and no microphone-permission retry is offered for the SDK-disabled build. Backend data and source memberships are preserved. Some original pack media and authenticated Android acceptance remain incomplete. Development signing may differ from older APKs; preserve the existing installation/data. No automatic-update manifest is published.' > premium-test-apk/README.txt
          (cd premium-test-apk && sha256sum *.apk > SHA256SUMS.txt)
      - name: Upload verified release-mode APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: NIMZO-PREMIUM-STORE-1-0-43-NO-VIVOX-TEST
          path: premium-test-apk/
          if-no-files-found: error
          retention-days: 14
      - name: Publish direct APK download links
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > /tmp/nimzo-ui43-notes.md <<'NOTES'
          Owner-requested Android TEST APK with the latest Falla SVIP/Hafla VIP source choices and screenshot fixes.

          - One profile membership identity; compact mic-seat nameplates and mute indicator, readable room seats.
          - Actual applied membership/equipped Store frame and entrance previews appear in the profile collections.
          - Compact premium room-user card uses the real active profile artwork and avatar. Existing social, gifting, moderation and editing actions are preserved.
          - Vivox remains owner-deferred. This SDK-disabled build reports voice unavailable instead of a misleading microphone-permission error/retry.

          The complete Flutter suite, compiled-original checks, APK signature and Android15 emulator installation/startup passed before publication. Authenticated two-user profile/room playback and the physical Moto G35 are not device-verified. Some genuine matching-tier originals remain missing; this is not a completed20-pack production release.

          Development signing may differ from previous test APKs. Preserve the existing app/data if Android rejects an update. No automatic-update manifest is published.
          NOTES
          gh release create "nimzo-v3-dynamic-1.0.43-${GITHUB_RUN_ID}" \
            premium-test-apk/*.apk premium-test-apk/SHA256SUMS.txt premium-test-apk/SOURCE_SHA.txt premium-test-apk/README.txt premium-test-apk/ACCEPTANCE.json premium-test-apk/STARTUP_TEST.txt \
            --target "$GITHUB_SHA" \
            --title "NIMZO 1.0.43 Profile and Room UI Test - Voice Disabled" \
            --notes-file /tmp/nimzo-ui43-notes.md \
            --prerelease
      - name: Upload launch diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nimzo-premium-no-vivox-launch-diagnostics
          path: android-launch-diagnostics/
          if-no-files-found: ignore
