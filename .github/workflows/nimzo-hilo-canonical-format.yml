name: NIMZO licensed UI canonical Dart format
on:
  push:
    branches:
      - feature/profile-reference-redesign
    paths:
      - .github/workflows/nimzo-hilo-canonical-format.yml
      - nimzo/lib/**
      - nimzo/test/**
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.6"
          channel: stable
          cache: true
      - name: Apply canonical formatting
        working-directory: nimzo
        run: dart format lib test
      - name: Commit formatting if necessary
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "NIMZO CI Formatter"
          git config user.email "actions@users.noreply.github.com"
          git add nimzo/lib nimzo/test
          if ! git diff --cached --quiet; then
            git commit -m "style: canonical Dart formatting after Hilo integration"
            git push origin HEAD:feature/profile-reference-redesign
          fi
