name: Rebaseline NIMZO Gift Tray screenshot

on:
  push:
    branches:
      - feature/profile-reference-redesign
    paths:
      - .github/workflows/nimzo-rebaseline-gift-tray.yml

permissions:
  contents: write

jobs:
  rebaseline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout latest NIMZO feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/profile-reference-redesign
          persist-credentials: true

      - name: Flutter stable
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.6"
          channel: stable
          cache: true

      - name: Install dependencies
        working-directory: nimzo
        run: flutter pub get

      - name: Render actual verified NIMZO gift tray screenshot
        working-directory: nimzo
        run: flutter test --update-goldens --dart-define=NIMZO_GOLDEN_TARGET=gifts test/remaining_visual_qa_test.dart

      - name: Commit only the new Gift Tray reference
        shell: bash
        run: |
          set -euo pipefail
          target=nimzo/test/goldens/remaining/gifts.png
          test -s "$target"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "$target"
          if git diff --cached --quiet; then
            echo "Golden unchanged"
            exit 0
          fi
          git commit -m "test(gifts): update NIMZO gift tray visual reference"
          git push origin HEAD:feature/profile-reference-redesign
