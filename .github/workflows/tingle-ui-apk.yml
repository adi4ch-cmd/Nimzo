name: NIMZO Tingle UI APK check
on:
  push:
    branches:
      - feature/tingle-ui-rebuild-20261017
  pull_request:
    branches:
      - feature/nimzo-ui-reset-20261017
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    defaults:
      run:
        working-directory: nimzo
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Show Flutter version
        run: flutter --version
      - name: Fetch packages
        run: flutter pub get
      - name: Check source
        run: flutter analyze --no-fatal-infos
      - name: Run Flutter tests
        run: flutter test
      - name: Build test APK
        run: flutter build apk --debug
      - name: Upload APK for device testing
        uses: actions/upload-artifact@v4
        with:
          name: nimzo-tingle-ui-debug-apk
          path: nimzo/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 7
