const LV=[['Wealth',18,'#16a34a',P.crown,380e6,600e6,'coins sent','Grows when you send gifts.'],['Charm',11,'#2563eb',star,150e6,300e6,'coins received','Grows when you receive gifts.'],['Active',26,'#dc2626',star,4500,10000,'active points','Grows while you stay active.']],BD=[[1,20,'Brown','#a16207'],[21,39,'Green','#16a34a'],[40,59,'Blue','#2563eb'],[60,79,'Pink','#db2777'],[80,99,'Red','#dc2626'],[100,120,'Gold','#d4a017']];
let LT=0;
function lvl(){LT=0;scr(hd('Level')+`<div class="bd pad" style="padding-top:12px"><div class="tb">${LV.map((x,j)=>`<span class="${j?'':'on'}" onclick="LT=${j};lv2()">${x[0]}</span>`).join('')}</div><div id="lv2"></div></div>`);lv2()}
function lv2(){document.querySelectorAll('.tb span').forEach((x,j)=>x.classList.toggle('on',j==LT));const x=LV[LT],b=BD.find(d=>x[1]>=d[0]&&x[1]<=d[1]);
$('#lv2').innerHTML=`<div class="card" style="text-align:center"><span class="lv big" style="--a:${x[2]}"><svg viewBox="0 0 24 24"><path d="${x[3]}"/></svg>${x[0]} ${x[1]}</span><p style="margin:10px 0 4px"><b>Tier: ${b[2]}</b> <small style="color:var(--m)">(${b[0]}-${b[1]})</small></p><div style="height:10px;border-radius:5px;background:var(--l)"><div style="height:10px;border-radius:5px;width:${x[4]/x[5]*100}%;background:${x[2]}"></div></div><small style="color:var(--m)">${fm(x[4])} / ${fm(x[5])} ${x[6]} to level ${x[1]+1}</small></div><div class="card" style="margin-top:10px"><b>How ${x[0]} grows</b><br><small style="color:var(--m)">${x[7]} Levels are updated by the backend.</small></div>
<h4 style="margin:14px 0 8px">Tier colors</h4>${BD.map(d=>`<div class="rr" style="${d==b?'font-weight:700':''}"><span style="display:flex;align-items:center;gap:10px;color:var(--t)"><i style="width:14px;height:14px;border-radius:50%;background:${d[3]}"></i>${d[2]}</span><span>Level ${d[0]}-${d[1]}${d==b?' · you':''}</span></div>`).join('')}<p class="note">${x[0]} has its own badge style, so equal levels never look the same across Wealth, Charm and Active. XP amounts are samples.</p>`}
setInterval(()=>{LV[2][4]++},30000);
const rav=(r,s)=>r.img?`<img class="av" src="${r.img}" style="width:${s}px;height:${s}px;object-fit:cover">`:av(r[0],r[2],s);
let RIMG='';
function rpe(){if(CR!==R[0])return toast('Only the room owner can edit this');RIMG='';scr(hd('Room profile')+`<div class="bd pad" style="padding-top:14px"><div style="text-align:center;margin-bottom:14px" id="rpv">${rav(CR,84)}</div>${fld('Room photo','<input type="file" accept="image/*" onchange="rpi(this)">')}${fld('Room name',`<input id="rn" maxlength="40" value="${q_(CR[0])}">`)}${fld('Announcement',`<input id="ra" maxlength="80" value="${q_(CR.ann||'Welcome')}">`)}<button class="btn" style="width:100%" onclick="rps()">Save</button></div>`)}
function rpi(i){const f=i.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{RIMG=r.result;$('#rpv').innerHTML=`<img class="av" src="${RIMG}" style="width:84px;height:84px;object-fit:cover">`};r.readAsDataURL(f)}
function rps(){const n=$('#rn').value.trim();if(n.length<2||n.length>40)return toast('Room name must be 2-40 characters');CR[0]=n;CR.ann=$('#ra').value.trim();if(RIMG)CR.img=RIMG;document.querySelectorAll('.scr').forEach(e=>e.remove());draw();room(0);toast('Room profile saved')}
const dpArt=c=>'data:image/svg+xml;utf8,'+encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96"><defs><radialGradient id="g" cx="30%" cy="25%" r="90%"><stop offset="0" stop-color="#fff" stop-opacity=".55"/><stop offset=".45" stop-color="${c}"/><stop offset="1" stop-color="#1b0b3a"/></radialGradient></defs><rect width="96" height="96" fill="url(#g)"/><circle cx="48" cy="48" r="30" fill="none" stroke="#fff" stroke-opacity=".35" stroke-width="2"/><circle cx="48" cy="48" r="38" fill="none" stroke="#fff" stroke-opacity=".18" stroke-width="2"/><rect x="41" y="27" width="14" height="26" rx="7" fill="#fff" fill-opacity=".92"/><path d="M34 46a14 14 0 0028 0M48 62v8" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round"/></svg>`);
R.forEach(r=>{if(!r.img)r.img=dpArt(r[2])});
let HT=0,REC=[1,2];const OW=['You','Ayesha','Bilal','Faisal'];
function home(){const all=R.map((_,i)=>i),idx=HT==0?all:HT==1?all.filter(i=>i&&FW.has(OW[i])):REC.slice();
return `<div class="top"><b class="logo">NIMZO</b><span style="display:flex;gap:4px;align-items:center"><button class="ib" onclick="srch()">${ic('search')}</button><button class="ib" onclick="notif()">${ic('bell')}</button><button class="chip" onclick="cty()">${U.c} ▾</button></span></div><div class="pad">
<div class="mine">${rav(R[0],46)}<div style="flex:1;margin:0 10px"><b>${esc(R[0][0])}</b><p>One account, one room</p></div><button class="btn" onclick="room(0)">Open my room</button></div>
<div class="tb">${['Popular','Followed','Recent'].map((t,j)=>`<span class="${j==HT?'on':''}" onclick="HT=${j};draw()">${t}</span>`).join('')}</div>
${idx.length?idx.map(i=>{const r=R[i];return `<div class="row" onclick="room(${i})">${rav(r,46)}<div class="x"><b>${esc(r[0])}</b><small>ID:${r[1]} · ${r[4]} online</small></div><div class="tag">${r[3]}</div></div>`}).join(''):`<p class="note">${HT==1?'Follow room owners to see their rooms here':'No recent rooms yet'}</p>`}<p class="note">Prototype · sample data</p></div>`}
draw();auth();
</script></body></html>
